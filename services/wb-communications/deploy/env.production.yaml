# ============================================================================
# EVETIS WB Communications — production (non-secret) env vars for Cloud Run.
# Used with:  gcloud run deploy --env-vars-file deploy/env.production.yaml
# Secrets are NOT here — they come from Secret Manager (see DEPLOY.md).
# Values are strings (Cloud Run requires string env values; quote booleans).
#
# These reflect LIVE production and must not be reverted to template defaults:
#   OPENAI_MODEL=gpt-5.6-terra   TELEGRAM_ALLOWED_USER_IDS=302044578,868383129
# The only shadow-related additions are the three COMMUNICATION_ENGINE_V2_* /
# BIGQUERY_SHADOW_TABLE keys below; everything else is the existing prod config.
# To turn shadow on later, prefer an ADDITIVE update (see DEPLOY.md):
#   gcloud run services update ... --update-env-vars COMMUNICATION_ENGINE_V2_ENABLED=true
# which never rewrites the other variables.
# ============================================================================

# --- GCP ---
GCP_PROJECT_ID: "project-fa311fc0-4d87-4781-986"
GCP_REGION: "europe-west1"
FIRESTORE_DATABASE: "(default)"
FIRESTORE_LOCATION: "eur3"
BIGQUERY_LOCATION: "EU"
BIGQUERY_DATASET: "evetis_communications"
BIGQUERY_CURRENT_TABLE: "communications_current"
BIGQUERY_EVENTS_TABLE: "communication_events"
# Separate shadow table — never mixed with the publication history.
BIGQUERY_SHADOW_TABLE: "communication_engine_shadow"
FIRESTORE_COLLECTION: "communications"

# --- OpenAI ---
OPENAI_MODEL: "gpt-5.6-terra"
OPENAI_TEMPERATURE: "0.7"
OPENAI_MAX_OUTPUT_TOKENS: "600"
PROMPT_VERSION: "reviews_v1"
PROMPTS_DIR: "prompts"

# --- Communication Engine v2 (shadow) ---
# Ship DISABLED. Do NOT enable v2 in production automatically — turn on the
# shadow flag as a separate, deliberate step AFTER deploy (see DEPLOY.md).
COMMUNICATION_ENGINE_V2_ENABLED: "false"
COMMUNICATION_ENGINE_V2_SHADOW_ONLY: "true"
# When "true" (requires _ENABLED=true), v2 becomes the PRIMARY draft generator
# (verified KB + validators) instead of reviews_v1. Still human-approved; WB
# publish gate unchanged. Flip deliberately, after reviewing shadow data.
COMMUNICATION_ENGINE_V2_PRIMARY: "false"

# --- Wildberries ---
WB_API_BASE_URL: "https://feedbacks-api.wildberries.ru"
WB_POLL_BATCH_SIZE: "30"
WB_MAX_PAGES: "20"
WB_MAX_ITEMS: "500"
# FAIL-CLOSED: real WB publishing stays OFF until confirmed on live Swagger.
WB_PUBLISH_ENABLED: "false"
WB_VERIFY_BEFORE_PUBLISH: "true"
# First answer to a feedback per current WB OpenAPI spec (confirm on live Swagger
# before enabling WB_PUBLISH_ENABLED). Listing stays on the base path.
WB_ANSWER_METHOD: "POST"
WB_ANSWER_PATH: "/api/v1/feedbacks/answer"
WB_FEEDBACKS_PATH: "/api/v1/feedbacks"

# --- Wildberries questions (separate entity, own gates; ship OFF) ---
# Turn polling on with WB_QUESTIONS_ENABLED=true; publishing answers stays behind
# its own gate WB_QUESTION_PUBLISH_ENABLED (keep false until verified on Swagger).
WB_QUESTIONS_ENABLED: "false"
WB_QUESTION_PUBLISH_ENABLED: "false"
WB_QUESTIONS_PATH: "/api/v1/questions"
WB_QUESTION_ANSWER_METHOD: "PATCH"
WB_QUESTION_ANSWER_STATE: "wbRu"
WB_QUESTIONS_FIRST_RUN_MAX: "20"
WB_MIN_INTERVAL_SECONDS: "0.6"

# --- Telegram ---
TELEGRAM_CHAT_ID: "302044578"
TELEGRAM_ALLOWED_USER_IDS: "302044578,868383129"
TELEGRAM_WEBHOOK_URL: ""
TELEGRAM_EDIT_TIMEOUT_SECONDS: "900"

# --- Concurrency / recovery ---
LOCK_LEASE_SECONDS: "300"
UPDATE_LEASE_SECONDS: "120"
OUTBOX_LEASE_SECONDS: "60"

# --- Ops ---
LOG_LEVEL: "INFO"
ENVIRONMENT: "production"
SHEETS_JOURNAL_ENABLED: "false"
