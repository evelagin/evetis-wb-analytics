# REF_INGREDIENT — ingredient IDENTITY only (no product facts, no effects).
#
# inci:      canonical INCI (display form)
# ru_name:   neutral Russian name for customer text; empty = use INCI as written
# patterns:  regexes (normalized text: lowercase, ё->е) used to detect a mention in a
#            customer message or a draft. Omitted = not detectable (generic ingredients).
# classes:   identity classes from the approved dictionary only (ODR-10). Currently only
#            'fragrance' and 'ceramide' (needed for ODR-10 / ODR-15 wording). A class
#            never licenses a derived "free-from" claim.
