# EVETIS Reviews & Q&A v3 — runtime POLICY (embedded into the knowledge snapshot).
#
# Policy is separate from product facts: it restricts what may be SAID, never what is TRUE.
# All regexes run on normalized text: lowercase, 'ё'->'е', whitespace collapsed,
# decimal comma kept as written (numbers are normalized separately by the verifier).
policy_version: "v3.policy.2026-09-28.1"

runtime:
  auto_publish: false
  v3_customer_facing: false
  few_shot_from_history: false

claim_policy:
  fact_claim_generation: true
  cosmetic_claim_generation: false          # ODR-06
  enabled_classes: [FACT_CLAIM]
  disabled_classes: [COSMETIC_CLAIM_PENDING, APPROVED_CANDIDATE, MEDICAL_OR_HIGH_RISK, PROHIBITED]

# APPROVED_GENERAL_GUIDANCE (ODR-05): starts EMPTY. Without a guidance_id general advice -> BLOCK.
approved_general_guidance: []

# OWNER_VERIFIED_SERVICE_INSTRUCTION (ODR-09): reserved; empty until physically verified.
owner_verified_service_instructions: []

commercial_verified_allowlist: [volume, net_mass, container_volume, bundle_title, customer_name]   # ODR-12

# --------------------------------------------------------------------------------------------
# Fixed wording (meaning approved by the owner). Rendered deterministically — never by the LLM.
# '{name}, ' is prepended only when a buyer name is available (first letter lowered).
# --------------------------------------------------------------------------------------------
templates:
  T-S1:
    decision: ODR-03
    text: "Нам очень жаль, что после применения средства появились такие ощущения. Рекомендуем прекратить использование. Если раздражение или дискомфорт сохраняются либо усиливаются, рекомендуем обратиться к врачу."
  T-S1R:
    decision: ODR-03
    text: "Нам жаль, что после применения средства возникла такая реакция. Хорошо, что сейчас она прошла. Если подобные ощущения появятся снова, рекомендуем прекратить использование средства."
  T-S2:
    decision: ODR-03
    text: "Нам очень жаль, что реакция сохраняется. Пожалуйста, прекратите использование средства. Поскольку симптомы не проходят или усиливаются, рекомендуем обратиться к врачу."
  T-PREGNANCY:
    decision: ODR-01
    text: "В документации производителя нет отдельных рекомендаций по применению средства во время беременности или грудного вскармливания. Поэтому мы не можем подтвердить его применение в этот период. Рекомендуем показать состав средства врачу и проконсультироваться перед использованием."
  T-CHILDREN:
    decision: ODR-01
    text: "В документации производителя нет отдельных данных о применении средства у детей, поэтому мы не можем подтвердить его применение для ребёнка. Рекомендуем проконсультироваться с врачом."
  T-INTENDED-USE:
    decision: ODR-13
    text: "По документации средство заявлено как {declared_as}, поэтому подтвердить его применение {asked_area} мы не можем."
  T-CERAMIDES-COMPLEX:
    decision: ODR-15
    text: "В составе указан комплекс церамидов."
  T-CERAMIDES-LIST:
    decision: ODR-15
    text: "В составе указаны церамиды NS, NG, NP, EOP, AP и AS."
  T-SVC-WB-DAMAGED:
    decision: ODR-08
    marketplace: WB
    text: "Нам жаль, что товар пришёл в таком состоянии. Пожалуйста, оформите обращение по товару через личный кабинет Wildberries и приложите фотографии товара и упаковки. Решение по обращению принимает площадка."
  T-SVC-WB-ORDER:
    decision: ODR-08
    marketplace: WB
    text: "Нам жаль, что заказ пришёл в таком виде. Пожалуйста, оформите обращение по заказу через личный кабинет Wildberries, укажите, что именно было получено, и при возможности приложите фотографии. Решение по обращению принимает площадка."

intended_use_wording:
  areas_ru: {face: "для лица", hands: "для рук", body: "для тела", hair: "для волос", feet: "для ног", nails: "для ногтей", eye_area: "для области вокруг глаз"}
  declared_as_ru:
    EVT-HC-HAND-300: "крем для рук"
    EVT-EP-ENZYME-75: "средство для лица"
    default_face: "средство для лица"
    default_hands_body: "крем для рук и тела"

# Trademark / fragrance (ODR-02). Blocked in ANY customer-facing text (AI or manual).
trademark_policy:
  blocked_terms: ['lost\s*cherry', 'лост\s*черр', 'oud\s*(&|and|и)?\s*wood', '\bуд\s*вуд', 'tom\s*ford', 'том\s*форд']
  customer_aliases: {"Lost Cherry": "вишнёвый аромат", "Oud Wood": "древесно-удовый аромат"}

ceramide_policy:
  blocked_patterns: ['(\d+|пят\w*|шест\w*|нескольк\w*)\s+(вид|тип)\w*\s+церамид', 'церамид\w*\s+(\d+|пят\w*|шест\w*)\s+(вид|тип)']

# --------------------------------------------------------------------------------------------
# Safety extraction (deterministic layer). The LLM classifier may ADD events or RAISE risk,
# never remove or lower. Stars and sentiment never lower safety risk.
# --------------------------------------------------------------------------------------------
safety:
  symptoms:
    irritation: ['раздраж']
    redness: ['покрасн', '\bкрасн(ота|оты|отой|ое|ые|ая|еет|еют|ела|ели|ыми|ым)\b', '\bredness\b']
    itching: ['\bзуд', '\bчеш(ется|утся|ет)', '\bчесал', 'чесотк']
    burning: ['\bжж(ет|ение|ения|ением|ло|ет|ется)', '\bжгл(о|а)\b', '\bжжен', '\bщип(лет|ало|ет|ит|лют|ал)', 'пощипыв', '\bожог', '\bпеч(ет|ет|ь|ло)\b', '\bпекл(о|а)\b']
    rash: ['\bсып(ь|и|ью)\b', 'высып', 'обсып', 'крапивниц', 'волдыр', '\bпрыщ\w*\s+(высыпал|вылез|полезл|пошл|появил)', '(высыпал|вылезл|полезл|пошли|появил\w*)\s+(прыщ|высыпан)']
    allergy_reported: ['аллерги', 'аллергическ']
    swelling: ['\bот[её]к', '\bотекл', '\bопух', '\bраспух', '\bотечн']
    nausea: ['\bтошн', '\bрвот', '\bвырвал', '\bстошнил', '\bмутит\b']
    breathing_problem: ['(трудно|тяжело|нечем|сложно|больно|невозможно|не\s+(могу|могла|мог|смогла|смог|получается))\s+дыш', 'задыха', '\bудушь', '\bодышк', 'свист\w*\s+в\s+груди']
    eye_exposure: ['(попал\w*|затек\w*|брызн\w*|попада\w*|угодил\w*)[^.!?]{0,25}\bглаз', '\bглаз\w*[^.!?]{0,20}(жж|щип|реж|бол|слез|покрасн)']
    ingestion: ['проглот', '\bвыпил\w*[^.!?]{0,20}(тоник|крем|сыворот|средств|пудр)', '\bсъел\w*', '(попал\w*|затек\w*)\s+в\s+рот', 'облизал']
    other_adverse_event: ['\bреакци(я|ю|ей|и)\b', 'стало\s+плохо', 'шелуш(ение|ится|илась|ится|ения)', '\bпятн(а|ами|о)\b']
  # explicit negation cues only ('не могу дышать' / 'не проходит' are NOT negations)
  negation_cues_before: ['\bне\s+было\b', '\bнет\b', '\bникак(ого|ой|их|ую)\b', '\bбез\b', '\bне\s+(вызвал|вызывает|вызывал|появил|появлял|возник|заметил|наблюда|почувствовал|ощутил|дал|дает)\w*', '\bотсутств\w*', '\bни\s+(разу|малейш\w*|следа)']
  negation_cues_after: ['^[^.!?]{0,20}\b(не\s+было|нет|не\s+появил\w*|не\s+возник\w*|не\s+вызвал\w*|отсутствует|не\s+наблюдал\w*)\b']
  uncertainty_cues: ['не\s+(могу|скажу|сказать|уверен\w*)\w*[^.!?]{0,15}(что|чтобы)?[^.!?]{0,30}\bне\b', '\bкажется\b', '\bвозможно\b', '\bвроде\b', 'как\s+будто', 'не\s+уверен', '\bпохоже\b']
  resolved_cues: ['(?<!не\s)\bпрошл(о|а|и)\b', '(?<!не\s)\bпрош[её]л\b', '\bисчезл\w*', '\bисчез\b', '(?<!не\s)\bушл(о|а|и)\b', 'сейчас\s+вс[её]\s+(хорошо|нормально|прошло|в порядке)', '\bуже\s+нет\b', '\bбольше\s+нет\b', '\bпропал\w*']
  persistent_cues: ['\bне\s+проход', '\bне\s+прош', '\bне\s+ух(одит|одят)', 'до\s+сих\s+пор', '\bдержит\w*', '\bсохраня\w*', '\bуже\s+(\d+|неделю|две|три|несколько|месяц|который|второй|третий)', '\b(\d+|несколько|пару|второй|третий|вторую|третью)\s+(дн|недел|месяц|сут)', 'вс[её]\s+ещ[её]', '\bникак\s+не\b']
  onset_new_cues: ['(сегодня|вчера|только\s+что|внезапно|вдруг|теперь|стал\w*)[^.!?]{0,30}(появил|началось|начался|пошл|возник)', 'раньше\s+не\s+было', 'впервые']
  worsening_cues: ['\bхуже\b', 'усилива', 'усилил', 'распростран', '\bсильнее\b', 'вс[её]\s+больше', 'прогрессир', 'разраста']
  severe_cues: ['\bсильн(ое|ая|ый|ые|о|ым|ой)\b', 'нестерпим', 'невыносим', 'не\s+могу\s+терпеть', '\bужасн(ое|ая|ый|ые|о)\b', 'вс[её]\s+лицо', 'по\s+всему\s+телу', 'вс[её]\s+тело', 'кошмарн']
  mild_cues: ['\bслегка\b', '\bнемного\b', '\bчуть\b', '\bлегк(ое|ая|ий|ие)\b', '\bнебольш\w*']
  body_location:
    face: ['\bлиц', '\bщ[её]к', '\bлб(у|а)?\b', 'подбород', '\bнос\b']
    lips: ['\bгуб']
    tongue: ['\bязык']
    throat: ['\bгорл', '\bгортан']
    eyes: ['\bглаз', '\bвек(и|о|ах|ам)?\b']
    hands: ['\bрук', '\bкист', '\bладон']
    body: ['\bтел(о|а|у)\b', '\bспин', '\bног(и|ах|у)?\b', '\bше[яи]\b']
  emergency_markers:           # ODR-04: closed list. R4 REQUIRES one of these.
    EM-01: {name: breathing_difficulty, any: ['(трудно|тяжело|нечем|сложно|больно|невозможно|не\s+(могу|могла|мог|смогла|смог|получается))\s+дыш', 'задыха', '\bудушь', '\bодышк', 'свист\w*\s+в\s+груди']}
    EM-02: {name: swelling_face_lips_tongue_throat, all_in_clause: [['\bот[её]к', '\bотекл', '\bопух', '\bраспух', '\bотечн'], ['\bлиц', '\bгуб', '\bязык', '\bгорл', '\bвек(и|о|ах)?\b', '\bглаз']], any: ['от[её]к\w*\s+квинке', 'сдавил\w*\s+горл']}
    EM-03: {name: loss_of_consciousness, any: ['потерял\w*\s+сознани', '\bобморок', 'без\s+сознания']}
    EM-04: {name: emergency_care_reported, any: ['\bскор(ую|ая|ой)\b', '\bбольниц', 'реанимац', 'госпитализ', 'неотложк', 'травмпункт', 'приемн\w*\s+(отделен|покой)']}
    EM-05: {name: eye_exposure_with_vision_change_or_severe_pain, requires_event: eye_exposure, any: ['(плохо|не|хуже)\s+вижу', '\bзрени', '\bослеп', '\bпелен', 'сильн\w*\s+(боль|режет|жжет|щиплет)', 'не\s+могу\s+открыть\s+глаз']}
    EM-06: {name: child_or_symptomatic_ingestion, requires_event: ingestion, any: ['\bреб[её]н', '\bсын\w*', '\bдоч\w*', '\bмалыш', '\bдет(и|ей|ям|ский)\b', '\bтошн', '\bрвот', 'стало\s+плохо', 'боль\w*\s+в\s+живот', 'отравл']}
  low_confidence_threshold: 0.7

# --------------------------------------------------------------------------------------------
# Situation signals (deterministic layer of the classifier). Signals, not canned answers.
# --------------------------------------------------------------------------------------------
situations:
  PACKAGING.empty_package: ['\bпуст(ой|ая|ую|ым|ое|ые)\b', 'недолив', 'не\s+долит', 'половин\w*\s+(флакон|банк|объем)']
  PACKAGING.leakage: ['протек', 'прот[её]к', 'вытек', 'подтек', '\bтеч[её]т\b', 'разлил', 'вылил']
  PACKAGING.broken_package: ['\bразбит', 'треснул', 'трещин', 'сломан', 'помят', 'поврежд', 'раскол', 'вскрыт\w*\s+(упаковк|коробк)']
  PACKAGING.dispenser_failure: ['(дозатор|помп|пипетк|распылител)\w*[^.?!]{0,35}(не\s+работ|сломан|слома|не\s+нажима|не\s+качает|заел|не\s+выход|не\s+выдав|засор|не\s+пшика|отвалил|брак)', '(не\s+работ|сломан|слома|заел|засор|отвалил|брак)\w*[^.?!]{0,35}(дозатор|помп|пипетк|распылител)', '\bне\s+качает', '\bне\s+выдавлива', 'крем\s+не\s+выходит']
  ORDER.wrong_product: ['не\s+тот\s+(товар|крем|тоник|аромат|продукт)', 'прислали\s+(не|друг)', '\bвместо\b', 'перепутал', 'пришел\s+друг', 'пришла\s+друг', 'пришло\s+друг']
  ORDER.incomplete_bundle: ['не\s+хватает', 'некомплект', 'не\s+было\s+(в\s+наборе|в\s+комплекте|сыворотк|крем|тоник)', 'отсутствовал\w*\s+(в\s+наборе|сыворотк|крем|тоник)', 'только\s+одн\w*\s+(баночк|флакон|средств)']
  ORDER.return_refund: ['верн(уть|ите)\s+деньги', '\bвозврат', 'вернуть\s+товар', 'компенсац']
  ORDER.availability: ['когда\s+(будет|появится|поступ)', 'в\s+наличии', 'поступлени', 'нет\s+в\s+продаже', 'закончил\w*\s+(на\s+складе|в\s+продаже)']
  ORDER.price: ['\bцен(а|у|ой|ы)\b', 'дорог', 'подешевел', 'подорожал', '\bскидк']
  PRODUCT_INFO.composition: ['\bсостав\b', '\bсоставе\b', '\binci\b', 'ингредиент', 'компонент']
  PRODUCT_INFO.ingredient_presence: ['есть\s+ли', '\bсодерж', 'в\s+составе\s+(есть|нет)', 'присутству', 'добавлен']
  PRODUCT_INFO.ingredient_concentration: ['процент', 'концентрац', '\bсколько\s+%', '\d\s*%\s*\?', 'какой\s+%']
  PRODUCT_INFO.country: ['\bстран\w*\s+(производ|изготов)', 'где\s+(произв|сделан|изготов)', 'чье\s+производств', '\bчей\b', 'китай', 'коре(я|йск)', 'российск\w*\s+производ']
  PRODUCT_INFO.manufacturer: ['\bпроизводител', 'кто\s+(производит|делает|выпускает)', '\bфабрик', '\bзавод']
  PRODUCT_INFO.importer: ['\bимпорт[её]р', '\bпоставщик']
  PRODUCT_INFO.shelf_life: ['срок\w*\s+годност', 'годен\s+до', 'сколько\s+хранит', 'просрочен']
  PRODUCT_INFO.pao: ['после\s+(вскрыти|открыти)', 'открыт\w*\s+(баноч|флакон|упаковк)[^.?!]{0,20}(сколько|месяц)']
  PRODUCT_INFO.volume: ['\bобъ[её]м', 'сколько\s+(мл|миллилитр|грамм)', '\bвес\b', 'сколько\s+весит']
  PRODUCT_INFO.ph: ['\bph\b', '\bпш\b', 'кислотност', '\bп\s*аш\b']
  PRODUCT_INFO.fragrance: ['\bзапах', '\bпахн', '\bаромат', 'отдушк', 'парфюм']
  PRODUCT_INFO.what_is_it_for: ['для\s+чего', 'от\s+чего\s+помога', 'зачем\s+нуж', 'какой\s+эффект', 'что\s+дает', 'помогает\s+ли', 'поможет\s+ли']
  REGULATORY.certification: ['декларац', 'сертификат', 'сертифиц', 'честн\w*\s+знак', 'маркировк', '\bсгр\b', 'регистрац']
  AUTHENTICITY.question: ['(это|он|она)?\s*оригинал\??', 'подлинн', 'не\s+подделка\?', 'оригинальн\w*\s+ли', 'как\s+отличить']
  AUTHENTICITY.counterfeit_accusation: ['подделк', '\bфейк', 'паленк', 'пал[её]н(ый|ая|ое)', 'не\s+оригинал', 'контрафакт', 'продаете\s+подделк']
  LEGAL.threat: ['\bв\s+суд\b', '\bсуд(ом|ебн)', 'роспотребнадзор', 'прокуратур', '\bюрист', '\bадвокат', '\bиск\b', 'претензи', 'жалоб\w*\s+в', '\bполици', 'защит\w*\s+прав\s+потребит']
  TRUST.review_removal: ['удаля\w*\s+отзыв', 'удалили\s+отзыв', 'скрыва\w*\s+отзыв', 'накрут', 'заказн\w*\s+отзыв']
  USAGE.how_to_use: ['как\s+(пользоваться|применять|наносить|использовать)', 'способ\s+применени', 'как\s+правильно', 'инструкци']
  USAGE.frequency: ['сколько\s+раз', 'как\s+часто', 'раз\s+в\s+(день|неделю)', 'каждый\s+день', 'ежедневно', 'утром\s+(и|или)\s+вечером', '\bутром\b', '\bвечером\b', 'на\s+ночь']
  USAGE.amount: ['сколько\s+(капель|наносить|нажатий|средства|грамм)', 'какое\s+количество']
  USAGE.sequence: ['в\s+каком\s+порядке', 'после\s+(тоника|сыворотки|крема|умывания|пудры)', 'перед\s+(кремом|сывороткой|тоником)', 'порядок\s+нанесени']
  USAGE.compatibility: ['можно\s+ли?\s*(вместе|совмещать|сочетать|комбинировать)', '\bсовмест', '\bсочета', '\bретинол', '\bретиноид', '\bвместе\s+с\b', 'с\s+другими\s+(кислот|средств)']
  SUITABILITY.pregnancy: ['беремен', 'кормлени\w*\s+грудью', '\bгв\b', 'лактац', 'кормящ']
  SUITABILITY.children: ['\bреб[её]н', '\bдетям\b', '\bдетей\b', '\bдет(ский|ская|ское)\b', 'подрост', '\b(1[0-7]|[1-9])\s*(лет|года|год)\b', 'школьни']
  SUITABILITY.skin_type: ['для\s+(сухой|жирной|чувствительной|комбинированной|нормальной|проблемной|зрелой)\s+кожи', 'тип\w*\s+кожи', 'подойд\w*\s+(ли\s+)?(для|при|мне)']
  SUITABILITY.intended_use_area: ['(для|на)\s+(тел|лиц|рук|волос|ног|стоп|ногт)\w*', '(мазать|намазать|наносить|нанести|использовать|применять|пользоваться)\b[^.?!]{0,30}\b(тел|лиц|рук|волос|ног|стоп|ногт)\w*', 'вокруг\s+глаз', 'можно\s+ли\s+(на|для)']
  EXPECTED_RESULT.no_effect: ['не\s+помог', 'эффект\w*\s+(нет|никакого|ноль|не\s+(увидел|заметил|вижу))', '\bне\s+работает', 'без\s+эффекта', 'результат\w*\s+(нет|никакого|ноль)', 'не\s+увидел\w*\s+(результ|эффект)', 'толку\s+(нет|ноль)', 'бесполезн']
  SENSORY.smell: ['\bзапах', '\bпахн', '\bвоня', '\bвонь', 'аромат']
  SENSORY.texture: ['текстур', '\bлипк', '\bжирн', '\bгуст', '\bжидк', 'впитыва', 'пленк', 'пл[её]нк', 'скатыва']
  SOCIAL.praise: ['отличн', 'супер', '\bкласс', 'нравит', 'понравил', 'рекоменд', '\bспасибо', '\bхорош', 'прекрасн', 'шикарн', '\bлучш', 'довол', 'восторг', '\bобожаю', 'замечательн', 'кайф', 'топ\b', 'советую']
  SOCIAL.negative: ['ужасн', '\bплох', 'разочаров', 'не\s+понравил', 'не\s+рекоменд', 'отврат', 'кошмар', 'деньги\s+на\s+ветер', 'не\s+советую', 'обман']

# Which fact types a situation needs (the Required Fact Planner). Signals only; the planner
# never enriches an answer with facts that were not asked for.
required_facts:
  PRODUCT_INFO.composition: [composition]
  PRODUCT_INFO.ingredient_presence: [ingredient_presence]
  PRODUCT_INFO.ingredient_concentration: [ingredient_concentration]
  PRODUCT_INFO.country: [country_of_origin]
  PRODUCT_INFO.manufacturer: [manufacturer]
  PRODUCT_INFO.importer: [importer]
  PRODUCT_INFO.shelf_life: [shelf_life]
  PRODUCT_INFO.pao: [pao]
  PRODUCT_INFO.volume: [volume]
  PRODUCT_INFO.ph: [ph]
  PRODUCT_INFO.fragrance: [fragrance_profile]
  PRODUCT_INFO.what_is_it_for: [efficacy_claim]
  REGULATORY.certification: [regulatory_declaration]
  AUTHENTICITY.question: [authenticity_fact]
  USAGE.how_to_use: [directions]
  USAGE.frequency: [frequency]
  USAGE.amount: [amount]
  USAGE.sequence: [directions]
  USAGE.compatibility: [compatibility_guidance]
  SUITABILITY.pregnancy: [medical_suitability_pregnancy]
  SUITABILITY.children: [medical_suitability_children]
  SUITABILITY.skin_type: [skin_type_suitability]
  SUITABILITY.intended_use_area: [intended_use]

# Facts that can never be KNOWN_ALLOWED in v3 (policy UNKNOWN / guidance required).
policy_unknown_facts:
  medical_suitability_pregnancy: {state: UNKNOWN, template: T-PREGNANCY}
  medical_suitability_children: {state: UNKNOWN, template: T-CHILDREN}
  skin_type_suitability: {state: UNKNOWN}
  compatibility_guidance: {state: UNKNOWN, reason: GUIDANCE_REQUIRED}
  efficacy_claim: {state: CONFLICT_POLICY, reason: COSMETIC_CLAIMS_DISABLED}
  authenticity_fact: {state: UNKNOWN, reason: BRAND_SELLER_FACT_MISSING}
  regulatory_declaration: {state: UNKNOWN, reason: T1C_NOT_DIGITIZED}
  amount: {state: UNKNOWN}

# --------------------------------------------------------------------------------------------
# Deterministic verifier lexicons (same verifier for AI drafts and manual operator text).
# --------------------------------------------------------------------------------------------
verifier:
  max_len: 1000
  general_advice:          # V-GENERAL: needs an approved guidance_id (library is empty)
    patch_test: ['тест\w*\s+на\s+(небольшом|маленьком)?\s*участк', 'протестир', 'на\s+запястье', 'на\s+сгибе\s+локтя', 'аллерготест']
    spf: ['\bspf\b', 'санскрин', 'солнцезащит', 'защит\w*\s+от\s+солнц', '\bуф\b|ультрафиолет']
    frequency: ['\bраз\s+в\s+(день|неделю|сутки|два\s+дня)', '(1|2|3|один|два|три|дважды|трижды)\s+раз', '\bежедневн', '\bкаждый\s+(день|вечер)', '\bутром\b', '\bвечером\b', '\bна\s+ночь\b', 'через\s+день']
    gradual_introduction: ['постепенн', '\bвводит', '\bначните\s+с', '\bначинайте\s+с', 'привыкн', 'привыкан', '\bадаптир']
    combining: ['\bсочета', '\bсовмещ', 'не\s+сочета', 'вместе\s+с\s+\w+', 'комбинир', '\bретинол', '\bретиноид', 'несовмест', 'кислот\w*\s+(вместе|одновременно)']
    treatment_or_medical_advice: ['\bлечени', '\bлечит\b', '\bлечить\b', 'антигистамин', 'супрастин', 'зиртек', 'мазь', 'крем\w*\s+с\s+гормон', '\bгормональн']
    skincare_regime: ['\bувлажняйте', '\bочищайте', 'умывайтесь', 'избегайте\s+солнц', 'пейте\s+(больше\s+)?вод', 'сбалансированн\w*\s+питани', 'оценивать\s+эффект', 'через\s+(несколько|пару|\d+)\s+(недел|дн|месяц)', 'регулярно\s+в\s+течение']
  medical:                 # V-MEDICAL
    - '\bлечит\b|\bлечени|\bвылеч|\bизлеч|терапевтич'
    - 'противовоспалит|антибактериальн|антисептич|антимикробн'
    - '(убира|снима|устраня|подавля)\w*\s+воспален'
    - '\bзаживл|регенерац'
    - '\bдиагноз|\bдерматит|\bэкзем|розаце|псориаз'
    - '\bот\s+(акне|прыщ|угрей|воспален|постакне)|\bпротив\s+(акне|прыщ|угрей)|избав\w*\s+от'
    - '(устраня|убира|уменьша)\w*\s+(постакне|пигментац|морщин)'
    - '\bомолаж|замедля\w*\s+старени|антивозраст|anti.?age|стимулир\w*\s+(выработк\w*\s+)?коллаген'
    - 'гипоаллерген|дерматологически|клинически|некомедоген'
    - 'не\s+вызыва\w*\s+(аллерг|раздраж)|\bбезопасн\w*|подходит\s+всем'
    - 'сужа\w*\s+пор|регулир\w*\s+(выработк\w*\s+)?(себум|жирност|кожн\w*\s+сал)|контролир\w*\s+жирност'
  cosmetic_claims:         # V-CLAIM (cosmetic claim generation disabled)
    - '\bпомога\w*|\bпоможет\b|способству'
    - '\bподдержива\w*\s+(кож|увлажн|баланс|ощущени|барьер|микробиом)'
    - '\bпита(ет|ют|ющ\w*|ние)\b'
    - '\bвосстанавлива|\bуспокаива|\bсмягча|\bразглажива|\bвыравнива|\bосветля|\bтонизир|\bукрепля|\bнасыща|\bобновля'
    - '\bувлажня(ет|ют)\b|\bувлажнени[ея]\b'
    - '\bделает\s+кож|\bприда[её]т|\bуменьша|\bборет|\bпредотвраща|\bотшелушива|очища\w*\s+пор'
    - '\bэффективн|\bработает\s+(на|против|послойно)|сияни|\bглоу\b'
    - '\bзащища\w*\s+(кож|от)'
    - 'без\s+(липкост|жирн\w*\s+пл[её]нк)|быстро\s+впитыва|не\s+оставляет\s+ощущени'
  free_from_claims:        # ODR-10: derived free-from claims disabled
    - 'без\s+(парабен|спирт|аллерген|сульфат|силикон|отдушк|кислот|консервант)'
    - '\bveg(an|ан)|\bвеган|без\s+компонент\w*\s+животн|cruelty|не\s+тестир\w*\s+на\s+животн'
    - 'натуральн\w*\s+состав|\b100\s*%\s*натурал'
  suitability:             # V-SUITABILITY
    subject: ['беремен', 'кормящ', 'лактац', 'грудн\w*\s+вскармлив', '\bреб[её]н', '\bдетям\b', '\bдетей\b', 'подрост']
    verdict: ['\bможно\b', '\bбезопасн', '\bподход', '\bподойд', '\bразреш', '\bдопуст', '\bнельзя\b', '\bпротивопоказ', '\bзапрещ']
  safety_language:         # V-SAFETY
    - 'адаптац|\bпривыка|\bпривыкн|\bпривыкан'
    - 'пуржинг|purging|очищени\w*\s+(кожи\s+)?изнутри|выгоня'
    - 'нормальн\w*\s+реакц|это\s+нормально|так\s+и\s+должно'
    - 'значит\W+(средство|крем|сыворотка|тоник|оно)\s+работает|средство\s+работает'
    - 'индивидуальн\w*\s+реакц|реакци\w*\s+на\s+актив'
    - '\bобострени|выход\w*\s+(прыщ|воспален|высыпан)'
  causal_explanation:      # unsupported causal explanations (always BLOCK)
    - '(из-за|вызван\w*|связан\w*\s+с|по\s+причине|реакци\w*\s+на)\s+(салицил|кислот|мят|ментол|отдушк|аромат|масл|компонент|ингредиент|актив|ниацинамид|эфирн)'
  service_promises:        # V-SERVICE
    - 'верн[её]м|вернем\s+деньги|возврат\w*\s+(гарантир|оформим|будет|обеспеч)|гарантир\w*\s+возврат'
    - 'компенсир|компенсац|возмест'
    - 'замен(им|ить\s+товар|у\s+товара|у\s+вам)|вышлем|отправим\s+(новый|замену|вам)|пришл[её]м'
    - '\bбесплатно|\bпромокод|скидк\w*\s+на\s+следующ'
    - 'гарантиру|одобр(ят|им|ено)|в\s+течение\s+(\d+|суток|недели|дня|часа)'
    - 'решим\s+(вопрос|проблему)|мы\s+(решим|разберемся\s+и\s+верн)'
  invented_contact:        # ODR-08: no invented contact path
    - 'напишите\s+(нам|в\s+чат|в\s+личн|на\s+почт)|свяжитесь\s+с\s+нами|в\s+личн\w*\s+сообщени|по\s+телефону|\bemail\b|e-mail|@|\bтелеграм|\bwhatsapp|\bватсап|наш\w*\s+сайт|в\s+директ'
  dispenser:               # V-DISPENSER (ODR-09)
    - '(\d+|несколько|пару|десят\w*)\s*[-–]?\s*(\d+)?\s*(раз|нажат|качк|прокач)'
    - 'прокач(ать|айте|ивать)|почти\s+всегда\s+помогает|несколько\s+десятков'
  refusal_meta:            # model refusals / meta text
    - 'как\s+(ии|искусственн|языков)|я\s+не\s+могу\s+(помочь|ответить)|извините,\s+но\s+я|as\s+an\s+ai|в\s+качестве\s+ии'
  comparative_disclosure:  # V-RESTRICTED semantic disclosure of a restricted concentration
    - '(высок|повышенн|максимальн|предельн|сильн|усиленн)\w*\s+(концентрац|процент|содержани|дозиров)'
    - '(концентрац|процент|содержани)\w*[^.!?]{0,25}(выше|больше|превыша|сильнее|максимальн)'
    - 'больше,?\s+чем|выше,?\s+чем|сильнее,?\s+чем|по\s+сравнению\s+с'
  defensive_tone:          # WARNING
    - 'вы\s+(неправильно|сами|не\s+так)|ваша\s+вина|мы\s+не\s+виноват|это\s+не\s+наша'
  advertising:             # WARNING
    - 'попробуйте\s+(также|наш|другие)|в\s+нашем\s+ассортименте|приобретите|рекомендуем\s+(наш|также)|линейк\w*\s+evetis|наш\w*\s+линейк'
  body_areas:              # V-USE: area mentions checked against T1 intended_use
    face: ['\bлиц(о|а|у|ом|е)\b']
    hands: ['\bрук(и|ам|ах|у)?\b', '\bкист']
    body: ['\bтел(о|а|у|ом|е)\b', '\bспин', '\bплеч']
    hair: ['\bволос']
    feet: ['\bног(и|ам|ах)?\b', '\bстоп(ы|ам)?\b']
    nails: ['\bногт']
    eye_area: ['вокруг\s+глаз', '\bвек(и|о|ах)\b']

product_type_words:        # V-ID: other product types mentioned
  serum: ['сыворот']
  cream: ['\bкрем']
  tonic: ['\bтоник']
  powder: ['\bпудр']
  hand_cream: ['\bкрем']
  body_cream: ['\bкрем']

llm:
  classifier_prompt_version: "v3.classifier.2026-09-28.2"
  generator_prompt_version: "v3.generator.2026-09-28.2"
  cost_usd_per_1k_input_tokens: 0.00125     # estimate for reporting only
  cost_usd_per_1k_output_tokens: 0.01
