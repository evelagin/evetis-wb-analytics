name: autonomy-engineer
# AE v1 · Инженер (Claude Code). НЕДОВЕРЕННЫЙ job: исполняет модель и её код.
# Права: contents READ; id-token — для sa-ae-reader (read-only, job_workflow_ref этого файла) и
# для короткоживущего токена Claude API (правило федерации Anthropic по job_workflow_ref ЭТОГО
# файла — ревьюерское правило этот job получить не может). Авторитетное состояние этот job не
# пишет: он отдаёт ответы агента артефактом, а их sha256 — через outputs. Доверенный job сверяет
# хеши и воспроизводит ответы сам.
# Модель угроз: у кода на раннере есть sudo — он может прочитать всё, что есть на ЭТОЙ машине.
# Поэтому здесь нет ничего, что давало бы больше, чем read-only SA и инженерная идентичность Claude.
on:
  workflow_call:
    inputs:
      # Не required: preflight их не передаёт; job прохода строго проверяет оба (пустое → отказ).
      run_id: {type: string, required: false, default: ""}
      state_sha: {type: string, required: false, default: ""}
      mode:
        description: "run — проход AE; preflight — только аутентификация Claude API (Фаза 0)"
        type: string
        required: false
        default: run
    outputs:
      hashes:
        description: "NAME=SHA256 через пробел — для --expect доверенного job"
        value: ${{ jobs.engineer.outputs.hashes }}

permissions: {}

jobs:
  engineer:
    if: inputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    outputs:
      hashes: ${{ steps.agent.outputs.hashes }}
    env:
      STATE_DIR: ${{ github.workspace }}/.ae-state
      RUN_ID: ${{ inputs.run_id }}
      STATE_SHA: ${{ inputs.state_sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      AE_READER_SA: ${{ vars.AE_READER_SA }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.AE_ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.AE_ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.AE_ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.AE_ANTHROPIC_WORKSPACE_ID }}
    steps:
      - name: guard — только main, строгие входы
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::только из main"; exit 1; }
          [[ "$RUN_ID" =~ ^run-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$ ]] || { echo "::error::неверный run_id"; exit 1; }
          [[ "$STATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::неверный state_sha"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install pinned dependencies (hash-checked)
        run: "pip install --only-binary=:all: --require-hashes -r tools/requirements-sql-ci.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"   # @anthropic-ai/claude-code@2.1.280: engines node >=22
      - name: install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.280
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.AE_READER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: clone state at pinned sha (read)
        env:
          GH_TOKEN: ${{ github.token }}   # contents: read — только на этот шаг
        run: bash tools/autonomy/ci/state_clone.sh "$STATE_SHA"
      - name: agent (PLAN → IMPLEMENT / FIX) on a scratch copy
        id: agent
        run: |
          state=$(python -m tools.autonomy.cli status --state-dir "$STATE_DIR" --run-id "$RUN_ID" | awk '{print $2}')
          case "$state" in PLANNING|IMPLEMENTING|FIXING) ;; *) echo "состояние $state — инженер не нужен"; echo "hashes=" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          # Статический ключ перекрыл бы федерацию (порядок разрешения SDK): его здесь быть не должно.
          if [ -n "${ANTHROPIC_API_KEY:-}${ANTHROPIC_AUTH_TOKEN:-}${ANTHROPIC_PROFILE:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::статический ключ/токен/профиль Anthropic перекрыл бы федерацию"; exit 1; fi
          # Фактический scope и срок токена Claude — ДО агента (policy.json → anthropic_runtime).
          # Вывод сторожа (отредактированный JSON без токена) — ещё и в диагностику агента.
          python -m tools.autonomy.anthropic_scope check --role engineer > "$RUNNER_TEMP/scope_guard.json" \
            || { cat "$RUNNER_TEMP/scope_guard.json"; exit 1; }
          cat "$RUNNER_TEMP/scope_guard.json"
          export ANTHROPIC_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/anthropic-oidc.jwt"
          bash tools/autonomy/ci/refresh_anthropic_oidc.sh
          ( while sleep 240; do bash tools/autonomy/ci/refresh_anthropic_oidc.sh || true; done ) &
          rc=0
          python -m tools.autonomy.cli agent-run --ci --engineer claude --reviewer none \
            --state-dir "$STATE_DIR" --run-id "$RUN_ID" --out "$RUNNER_TEMP/pending" \
            --sandbox-root "$RUNNER_TEMP/sandboxes" --scope-guard-file "$RUNNER_TEMP/scope_guard.json" \
            --project "$GCP_PROJECT_ID" --token-command "gcloud auth print-access-token" \
            --audit-identity "$AE_READER_SA" > "$RUNNER_TEMP/agent.json" || rc=$?
          # 0 — вывод есть; 3 — агент отказал, диагностика записана (документированная передача доверенному
          # ingest, который запаркует прогон в BLOCKED с классом отказа в причине); исключения внутри агента/оркестратора тоже здесь (стадия WRAPPER_EXCEPTION в диагностике);
          # иной код — сбой ДО записи диагностики (импорт, окружение): job падает.
          case "$rc" in 0|3) ;; *) echo "::error::сбой обёртки агента (код $rc)"; exit "$rc" ;; esac
          python -c 'import json,sys; o=json.load(open(sys.argv[1]))["outputs"]; print("hashes=" + " ".join(f"{k}={v}" for k,v in o.items()))' \
            "$RUNNER_TEMP/agent.json" >> "$GITHUB_OUTPUT"
          python -m tools.autonomy.cli diag-summary --file "$RUNNER_TEMP/pending/engineer_diagnostics.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 3 ]; then
            echo "::error::агент инженера отказал — диагностика передана доверенному ingest (см. итог job'а)"
          fi
      # При ЛЮБОМ исходе шага агента: диагностика переживает отказ до плана (инцидент M6 Phase 1).
      # Доверенный ingest принимает только файлы с sha256 из outputs; прочее здесь — для человека.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ae-${{ inputs.run_id }}-engineer-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pending
          retention-days: 30
          if-no-files-found: ignore

  # Фаза 0: только аутентификация Claude API инженера. Тот же файл → тот же job_workflow_ref, что у
  # прохода, поэтому совпадает правило федерации. Нет: Claude Code, модели, GCP (sa-ae-reader),
  # autonomy-state, артефактов. Двойной выключатель: вход mode и AE_PREFLIGHT_ENABLED.
  preflight:
    if: inputs.mode == 'preflight' && vars.AE_PREFLIGHT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write    # только OIDC → обмен на токен Claude API
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.AE_ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.AE_ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.AE_ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.AE_ANTHROPIC_WORKSPACE_ID }}
    steps:
      - name: guard — только main, только autonomy-run.yml@main, только workflow_dispatch
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::только из main"; exit 1; }
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { echo "::error::только workflow_dispatch"; exit 1; }
          [ "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/autonomy-run.yml@refs/heads/main" ] \
            || { echo "::error::только из autonomy-run.yml@main"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Claude API WIF preflight — только обмен токена (stdlib, без модели)
        run: python3 -m tools.autonomy.anthropic_scope preflight --role engineer
