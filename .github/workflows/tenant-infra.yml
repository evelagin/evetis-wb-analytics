name: tenant-infra
# Tenancy — инфраструктура выделенного арендатора: план, применение ЗАМОРОЖЕННОГО плана,
# пакет SQL через Tables API. Всё — одним файлом, потому что доверие WIF (mpa-platform,
# tenant-infra-pool / github-tenant-infra) выдаётся ТОЛЬКО этому файлу, из refs/heads/main,
# событию workflow_dispatch, на github-hosted раннере (условие провайдера, T3.1B). Любая другая
# ветка, событие или workflow токена не получит; условие WIF не меняется.
#
# operation:
#   plan        — план → сканер → хеши и метаданные → неизменяемый артефакт (3 дня). Не применяет.
#   apply       — job verify (без id-token): провенанс артефакта прогона plan по API GitHub,
#                 хеши, контракт, сканер, дельта; job apply (needs: verify): WIF и
#                 `terraform apply <tenant.tfplan>` ровно проверенного файла. Плана нет.
#   sql-preview — только чтение: что пакет SQL создаст/обновит (Tables API) + проба прав деплоера.
#   sql-deploy  — представления пакета через tables.insert/update, чтение назад и сверка.
#   sql-verify  — только чтение: живые представления = пакет, таблицы = контракт.
#
# Идентичности (T4.1): plan/apply — sa-tenant-provisioner@mpa-platform (инфраструктура, без
# чтения данных); sql — sa-sql-deployer@<проект арендатора> (только роли mpaSql* в ACL датасетов).
# Условие провайдера WIF одно на оба SA: разделение — по job'ам этого файла и по правам в GCP.
# Привязку workloadIdentityUser на деплоер создаёт владелец (tools/tenancy/tenant_bootstrap.py).
#
# Одобрение — сам запуск владельцем (GITHUB_ACTOR_ID, первая попытка прогона) с точными входами.
# Environments с обязательными ревьюерами в приватном репозитории на GitHub Free недоступны, main
# не защищённая ветка; второго человека здесь нет, и мы этого не изображаем.
#
# Входы идут в шаги только через env и сверяются по форме до всего остального. Проект, префикс
# state, образ и команды Terraform выводятся из реестра (tools/tenancy/tenant_infra.py).
#
# Цепочка поставки (M5): все actions закреплены полным SHA коммита (тег — в комментарии);
# провайдеры Terraform — только из закоммиченного .terraform.lock.hcl (-lockfile=readonly).
# Токен получает любой шаг job'а с id-token: write, поэтому сторонний код здесь — только
# закреплённые action'ы: checkout, setup-python, setup-terraform, auth, upload-/download-artifact.
on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "tenant_id из реестра tenants/ (например client_001)"
        required: true
        type: string
      operation:
        description: "plan | apply | sql-preview | sql-deploy | sql-verify"
        required: true
        type: choice
        default: plan
        options: [plan, apply, sql-preview, sql-deploy, sql-verify]
      source_run_id:
        description: "apply: id прогона operation=plan"
        required: false
        type: string
        default: ""
      expected_source_commit:
        description: "apply: коммит main, из которого сделан план (40 hex)"
        required: false
        type: string
        default: ""
      expected_tfplan_sha256:
        description: "apply: sha256 бинарного tenant.tfplan"
        required: false
        type: string
        default: ""
      expected_contract_sha256:
        description: "apply: sha256 контракта арендатора"
        required: false
        type: string
        default: ""
      expected_delta:
        description: "apply: ожидаемая дельта add/change/destroy, например 15/0/0"
        required: false
        type: string
        default: ""
      expected_manifest_sha256:
        description: "sql-*: sha256 манифеста рендера"
        required: false
        type: string
        default: ""
      expected_package_sha256:
        description: "sql-*: sha256 отрендеренного пакета"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: tenant-infra-${{ inputs.tenant_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'plan'
    timeout-minutes: 20
    env:
      TENANT_ID: ${{ inputs.tenant_id }}
    steps:
      - name: only main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "только refs/heads/main"; exit 1; }
      - name: tenant_id shape (before anything else)
        # Защита в глубину: авторитет — строгий реестр. grep -x работал построчно и
        # пропускал многострочный ввод (L4); здесь перевод строки отвергается явно,
        # а =~ сверяет ВСЮ строку целиком.
        shell: bash
        run: |
          case "$TENANT_ID" in *$'\n'*|*$'\r'*) echo "tenant_id: перевод строки запрещён"; exit 1 ;; esac
          [[ "$TENANT_ID" =~ ^[a-z][a-z0-9_]{2,30}$ ]] || { echo "tenant_id недопустим"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install pinned dependencies (hash-checked)
        run: "pip install --only-binary=:all: --require-hashes -r tools/requirements-sql-ci.txt"
      - name: validate tenant registry
        run: python tools/tenancy/registry.py validate
      - name: render contract (registry authority)
        run: python tools/tenancy/tenant_infra.py render "$TENANT_ID" "$RUNNER_TEMP/tenant"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/777428383056/locations/global/workloadIdentityPools/tenant-infra-pool/providers/github-tenant-infra
          service_account: sa-tenant-provisioner@mpa-platform.iam.gserviceaccount.com
      - name: fmt, init, validate, plan, plan-scan (no apply)
        run: python tools/tenancy/tenant_infra.py plan "$TENANT_ID" "$RUNNER_TEMP/tenant"
      - name: freeze plan (scanner re-run, hashes, deploy metadata)
        id: freeze
        run: python tools/tenancy/tenant_deploy.py package-plan "$TENANT_ID" "$RUNNER_TEMP/tenant"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.freeze.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/tenant/tenant.tfplan
            ${{ runner.temp }}/tenant/plan.json
            ${{ runner.temp }}/tenant/contract.auto.tfvars.json
            ${{ runner.temp }}/tenant/deploy-metadata.json
          retention-days: 3
          if-no-files-found: error

  verify:
    # Проверка замороженного плана — в job'е БЕЗ id-token: здесь нельзя получить WIF, а API GitHub
    # и скачанный zip обрабатываются только тут. Проверенные файлы уходят job'у apply артефактом
    # этого же прогона (1 день); apply снова сверяет их с sha256 оператора.
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      TENANT_ID: ${{ inputs.tenant_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      EXPECTED_TFPLAN_SHA256: ${{ inputs.expected_tfplan_sha256 }}
      EXPECTED_CONTRACT_SHA256: ${{ inputs.expected_contract_sha256 }}
      EXPECTED_DELTA: ${{ inputs.expected_delta }}
    steps:
      - name: only main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "только refs/heads/main"; exit 1; }
      - name: input shape (before anything else)
        shell: bash
        run: |
          for v in "$TENANT_ID" "$SOURCE_RUN_ID" "$EXPECTED_SOURCE_COMMIT" "$EXPECTED_TFPLAN_SHA256" "$EXPECTED_CONTRACT_SHA256" "$EXPECTED_DELTA"; do
            case "$v" in *$'\n'*|*$'\r'*|*' '*) echo "вход: пробел или перевод строки запрещён"; exit 1 ;; esac
          done
          [[ "$TENANT_ID" =~ ^[a-z][a-z0-9_]{2,30}$ ]] || { echo "tenant_id недопустим"; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "source_run_id недопустим"; exit 1; }
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_source_commit недопустим"; exit 1; }
          [[ "$EXPECTED_TFPLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "expected_tfplan_sha256 недопустим"; exit 1; }
          [[ "$EXPECTED_CONTRACT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "expected_contract_sha256 недопустим"; exit 1; }
          [[ "$EXPECTED_DELTA" =~ ^[0-9]{1,4}/[0-9]{1,4}/[0-9]{1,4}$ ]] || { echo "expected_delta недопустим"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install pinned dependencies (hash-checked)
        run: "pip install --only-binary=:all: --require-hashes -r tools/requirements-sql-ci.txt"
      - name: validate tenant registry
        run: python tools/tenancy/registry.py validate
      - name: fetch and verify frozen plan (no id-token in this job)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/tenancy/tenant_deploy.py fetch "$TENANT_ID" "$RUNNER_TEMP/frozen"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frozen/tenant.tfplan
            ${{ runner.temp }}/frozen/plan.json
            ${{ runner.temp }}/frozen/contract.auto.tfvars.json
            ${{ runner.temp }}/frozen/deploy-metadata.json
          retention-days: 1
          if-no-files-found: error

  apply:
    runs-on: ubuntu-24.04
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TENANT_ID: ${{ inputs.tenant_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      EXPECTED_TFPLAN_SHA256: ${{ inputs.expected_tfplan_sha256 }}
      EXPECTED_CONTRACT_SHA256: ${{ inputs.expected_contract_sha256 }}
      EXPECTED_DELTA: ${{ inputs.expected_delta }}
    steps:
      - name: only main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "только refs/heads/main"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install pinned dependencies (hash-checked)
        run: "pip install --only-binary=:all: --require-hashes -r tools/requirements-sql-ci.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frozen
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/777428383056/locations/global/workloadIdentityPools/tenant-infra-pool/providers/github-tenant-infra
          service_account: sa-tenant-provisioner@mpa-platform.iam.gserviceaccount.com
      - name: apply exact frozen plan (re-verify vs operator sha, init, show, apply file; never plan)
        run: python tools/tenancy/tenant_deploy.py apply "$TENANT_ID" "$RUNNER_TEMP/frozen"

  sql:
    runs-on: ubuntu-24.04
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'sql-preview' || inputs.operation == 'sql-deploy' || inputs.operation == 'sql-verify')
    timeout-minutes: 20
    env:
      TENANT_ID: ${{ inputs.tenant_id }}
      OPERATION: ${{ inputs.operation }}
      EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
      EXPECTED_PACKAGE_SHA256: ${{ inputs.expected_package_sha256 }}
    steps:
      - name: only main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "только refs/heads/main"; exit 1; }
      - name: input shape (before anything else)
        shell: bash
        run: |
          [[ "$TENANT_ID" =~ ^[a-z][a-z0-9_]{2,30}$ ]] || { echo "tenant_id недопустим"; exit 1; }
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "expected_manifest_sha256 недопустим"; exit 1; }
          [[ "$EXPECTED_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "expected_package_sha256 недопустим"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install pinned dependencies (hash-checked)
        run: "pip install --only-binary=:all: --require-hashes -r tools/requirements-sql-ci.txt"
      - name: validate tenant registry
        run: python tools/tenancy/registry.py validate
      - name: render SQL package and verify hashes (before any GCP credential)
        run: |
          python tools/tenancy/sql_package.py render "$TENANT_ID" "$RUNNER_TEMP/sql"
          python tools/tenancy/sql_deploy.py verify-package "$TENANT_ID" "$RUNNER_TEMP/sql"
      - name: resolve SQL deployer identity (registry, not the provisioner)
        # T4.1: пакет SQL пишет sa-sql-deployer@<проект арендатора> — SA выводится из реестра
        # (tools/tenancy/sql_identity.py). Провижионер data-blind и сюда не допускается.
        id: ident
        run: python tools/tenancy/sql_identity.py deployer-email "$TENANT_ID" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        id: auth
        with:
          workload_identity_provider: projects/777428383056/locations/global/workloadIdentityPools/tenant-infra-pool/providers/github-tenant-infra
          service_account: ${{ steps.ident.outputs.email }}
          token_format: access_token
          access_token_lifetime: 900s
          # userinfo.email — чтобы sql_deploy сверил принципал токена через tokeninfo (закрытый отказ).
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/userinfo.email
      - name: Tables API (no query jobs)
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          case "$OPERATION" in
            sql-preview) cmd=plan-live ;;
            sql-deploy)  cmd=deploy ;;
            sql-verify)  cmd=verify-live ;;
            *) echo "неизвестная операция"; exit 1 ;;
          esac
          python tools/tenancy/sql_deploy.py "$cmd" "$TENANT_ID" "$RUNNER_TEMP/sql"
