name: deploy-prod
# Промоушен ПРОВЕРЕННОГО в shadow образа в prod. Образ НЕ пересобирается.
# GIT_SHA берём из source_git_sha сборки (а НЕ из commit запуска этого workflow).
on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Полный digest из shadow (…/wb-loader@sha256:…)"
        required: true
      source_git_sha:
        description: "SHA коммита, из которого собран этот образ (из summary deploy-shadow)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  promote-prod:
    runs-on: ubuntu-latest
    environment: production # ручной approval
    # Входы dispatch — только через env, не подстановкой ${{ }} в текст скрипта: свободный текст
    # из формы не должен становиться кодом shell в job'е с токеном sa-deployer.
    env:
      DIGEST: ${{ inputs.image_digest }}
      SOURCE_GIT_SHA: ${{ inputs.source_git_sha }}
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Validate digest
        run: |
          EXPECTED_PREFIX="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/wb-loader@sha256:"
          case "$DIGEST" in
            "${EXPECTED_PREFIX}"*) ;;
            *) echo "BAD digest: ожидался префикс ${EXPECTED_PREFIX}"; exit 1 ;;
          esac
          # После префикса — ровно 64 hex и ничего больше: запятая в digest стала бы лишними
          # переменными в --update-env-vars prod-Job'ов. SHA исходников — полный, 40 hex.
          [[ "${DIGEST#"$EXPECTED_PREFIX"}" =~ ^[0-9a-f]{64}$ ]] || { echo "BAD digest: после префикса нужен ровно sha256 из 64 hex"; exit 1; }
          [[ "$SOURCE_GIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "BAD source_git_sha: нужен полный SHA из 40 hex"; exit 1; }
          echo "digest ok: $DIGEST"
          # digest должен существовать в реестре
          gcloud artifacts docker images describe "$DIGEST" >/dev/null
      - name: Deploy prod Jobs (промоушен того же digest, source sha)
        # PR-Mart3b-2 (аудит REV2, блокер #1): продвигаем ОДИН и тот же проверенный digest во ВСЕ
        # prod-Job'ы. Все используют один образ (dispatch по args[0] в cli.ts).
        # Без wb-mart-prod здесь Terraform-created Job остался бы на bootstrap hello-образе и
        # ручной/scheduler-запуск не вызвал бы `node dist/cli.js mart`.
        #
        # PR-1: добавлен wb-prices-prod — ровно по той же причине. Пропущенный в этом списке
        # Job молча остаётся на hello, который выходит с кодом 0 и ничего не наблюдает; при
        # следующих промоушенах он бы отставал по digest от остальных, и расхождение
        # не проявилось бы ни в одном «зелёном» прогоне.
        run: |
          for JOB in wb-stocks-prod wb-mart-prod wb-prices-prod wb-tariffs-prod; do
            echo "== promote ${JOB} =="
            gcloud run jobs update "${JOB}" \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          done
      - name: Deploy unitka-engine-prod (тот же digest)
        # UNITKA ENGINE v1 (Stage E1): тот же образ, dispatch args[0]=unitka. Пропуск оставил бы
        # Engine на bootstrap hello (урок PR-1). Шаг guarded: до infra apply Job'а нет, и это не
        # должно валить промоушен остальных prod-Job'ов.
        run: |
          if gcloud run jobs describe unitka-engine-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update unitka-engine-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=unitka-engine-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy ozon-unitka-prod (тот же digest)
        # Gate 9: суточный писатель Ozon-Юнитки. Тот же образ, dispatch args[0]=ozon-unitka.
        # Пропуск в этом списке оставил бы Job на bootstrap hello, который выходит с кодом 0
        # и молча ничего не пишет — расхождение не проявилось бы ни в одном «зелёном» прогоне
        # (урок PR-1). Guard сохраняет совместимость до первого infra apply.
        run: |
          if gcloud run jobs describe ozon-unitka-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update ozon-unitka-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=ozon-unitka-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy ozon-cpo-orders-prod (тот же digest)
        # Phase B (2026-10-08): «Оплата за заказ» Ozon, dispatch args[0]=ozon-cpo-orders, SA sa-ozon-cpo-loader.
        # Guard сохраняет совместимость до первого infra apply. Секреты — имена в Terraform env; workflow
        # их не читает и не меняет. Пропуск оставил бы Job на bootstrap-образе (урок PR-1).
        run: |
          if gcloud run jobs describe ozon-cpo-orders-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update ozon-cpo-orders-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=ozon-cpo-orders-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy unitka-store-pnl-prod (тот же digest)
        # Phase C (2026-10-09): P&L магазина WB, dispatch args[0]=unitka-store-pnl, SA sa-loaders-prod.
        # Лист — только чтение (scope readonly), пишет лишь снимок wb_ops. Guard — до первого infra apply.
        run: |
          if gcloud run jobs describe unitka-store-pnl-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update unitka-store-pnl-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=unitka-store-pnl-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy wb-paid-storage-prod (тот же digest)
        # Stage E4: Job создаётся Terraform'ом. Guard сохраняет совместимость до первого infra apply.
        # Секрет остаётся WB_TOKEN_ANALYTICS из Terraform env; workflow его не читает и не меняет.
        run: |
          if gcloud run jobs describe wb-paid-storage-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update wb-paid-storage-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=wb-paid-storage-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy wb-promo-prod (тот же digest)
        # PR-PROMO-1: наблюдатель акций WB. Тот же образ, dispatch args[0]=promo.
        # Guard сохраняет совместимость до первого infra apply: пока Terraform не
        # создал Job, шаг предупреждает и не валит промоушен остальных.
        #
        # Пропуск Job'а в этом списке — тот самый дефект, ради которого сюда
        # добавляли wb-prices-prod: Job молча остаётся на bootstrap hello, который
        # выходит с кодом 0 и НИЧЕГО не наблюдает, а история акций восстановлению
        # не подлежит — у Ozon исторической выгрузки акций нет вовсе.
        #
        # Секрет наблюдателя (WB_PRICES_READ_TOKEN) выставляется Terraform'ом
        # вместе с остальным env; workflow его не читает и не меняет.
        run: |
          if gcloud run jobs describe wb-promo-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update wb-promo-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=wb-promo-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy wb-funnel-prod (отдельным шагом — у него свой секрет)
        # UNITKA 2.0 R6/R7. Воронка ходит в WB под ОТДЕЛЬНЫМ токеном WB_TOKEN_REPORTS
        # (решение владельца); WB_TOKEN_ANALYTICS не трогаем — на нём остатки и
        # платное хранение. Шаг отдельный, чтобы WB_ANALYTICS_SECRET не попал
        # на остальные Job'ы: у них секрет свой и менять его не требуется.
        #
        # env у Job стоит в ignore_changes Terraform'а на UPDATE, поэтому имя
        # секрета живому Job'у выставляет именно этот шаг, а не apply.
        # Предусловие: infra.yml apply уже выдал sa-loaders-prod
        # roles/secretmanager.secretAccessor на WB_TOKEN_REPORTS.
        run: |
          gcloud run jobs update wb-funnel-prod \
            --region ${{ vars.GCP_REGION }} \
            --image "${DIGEST}" \
            --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}",WB_ANALYTICS_SECRET=WB_TOKEN_REPORTS
      # НЕ включает Scheduler и НЕ меняет IAM.
