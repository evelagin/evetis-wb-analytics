name: deploy-prod
# Промоушен ПРОВЕРЕННОГО в shadow образа в prod. Образ НЕ пересобирается.
# GIT_SHA берём из source_git_sha сборки (а НЕ из commit запуска этого workflow).
on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Полный digest из shadow (…/wb-loader@sha256:…)"
        required: true
      source_git_sha:
        description: "SHA коммита, из которого собран этот образ (из summary deploy-shadow)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  promote-prod:
    runs-on: ubuntu-latest
    environment: production # ручной approval
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate digest
        run: |
          DIGEST="${{ inputs.image_digest }}"
          EXPECTED_PREFIX="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/wb-loader@sha256:"
          case "$DIGEST" in
            "${EXPECTED_PREFIX}"*) echo "digest ok: $DIGEST" ;;
            *) echo "BAD digest: ожидался префикс ${EXPECTED_PREFIX}"; exit 1 ;;
          esac
          # digest должен существовать в реестре
          gcloud artifacts docker images describe "$DIGEST" >/dev/null
      - name: Deploy prod Jobs (промоушен того же digest, source sha)
        # PR-Mart3b-2 (аудит REV2, блокер #1): продвигаем ОДИН и тот же проверенный digest во ВСЕ
        # prod-Job'ы. Все используют один образ (dispatch по args[0] в cli.ts).
        # Без wb-mart-prod здесь Terraform-created Job остался бы на bootstrap hello-образе и
        # ручной/scheduler-запуск не вызвал бы `node dist/cli.js mart`.
        #
        # PR-1: добавлен wb-prices-prod — ровно по той же причине. Пропущенный в этом списке
        # Job молча остаётся на hello, который выходит с кодом 0 и ничего не наблюдает; при
        # следующих промоушенах он бы отставал по digest от остальных, и расхождение
        # не проявилось бы ни в одном «зелёном» прогоне.
        run: |
          for JOB in wb-stocks-prod wb-mart-prod wb-prices-prod wb-tariffs-prod; do
            echo "== promote ${JOB} =="
            gcloud run jobs update "${JOB}" \
              --region ${{ vars.GCP_REGION }} \
              --image "${{ inputs.image_digest }}" \
              --update-env-vars IMAGE_DIGEST="${{ inputs.image_digest }}",GIT_SHA="${{ inputs.source_git_sha }}"
          done
      - name: Deploy unitka-engine-prod (тот же digest)
        # UNITKA ENGINE v1 (Stage E1): тот же образ, dispatch args[0]=unitka. Пропуск оставил бы
        # Engine на bootstrap hello (урок PR-1). Шаг guarded: до infra apply Job'а нет, и это не
        # должно валить промоушен остальных prod-Job'ов.
        run: |
          if gcloud run jobs describe unitka-engine-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update unitka-engine-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${{ inputs.image_digest }}" \
              --update-env-vars IMAGE_DIGEST="${{ inputs.image_digest }}",GIT_SHA="${{ inputs.source_git_sha }}"
          else
            echo "::warning title=unitka-engine-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy wb-paid-storage-prod (тот же digest)
        # Stage E4: Job создаётся Terraform'ом. Guard сохраняет совместимость до первого infra apply.
        # Секрет остаётся WB_TOKEN_ANALYTICS из Terraform env; workflow его не читает и не меняет.
        run: |
          if gcloud run jobs describe wb-paid-storage-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update wb-paid-storage-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${{ inputs.image_digest }}" \
              --update-env-vars IMAGE_DIGEST="${{ inputs.image_digest }}",GIT_SHA="${{ inputs.source_git_sha }}"
          else
            echo "::warning title=wb-paid-storage-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy wb-funnel-prod (отдельным шагом — у него свой секрет)
        # UNITKA 2.0 R6/R7. Воронка ходит в WB под ОТДЕЛЬНЫМ токеном WB_TOKEN_REPORTS
        # (решение владельца); WB_TOKEN_ANALYTICS не трогаем — на нём остатки и
        # платное хранение. Шаг отдельный, чтобы WB_ANALYTICS_SECRET не попал
        # на остальные Job'ы: у них секрет свой и менять его не требуется.
        #
        # env у Job стоит в ignore_changes Terraform'а на UPDATE, поэтому имя
        # секрета живому Job'у выставляет именно этот шаг, а не apply.
        # Предусловие: infra.yml apply уже выдал sa-loaders-prod
        # roles/secretmanager.secretAccessor на WB_TOKEN_REPORTS.
        run: |
          gcloud run jobs update wb-funnel-prod \
            --region ${{ vars.GCP_REGION }} \
            --image "${{ inputs.image_digest }}" \
            --update-env-vars IMAGE_DIGEST="${{ inputs.image_digest }}",GIT_SHA="${{ inputs.source_git_sha }}",WB_ANALYTICS_SECRET=WB_TOKEN_REPORTS
      # НЕ включает Scheduler и НЕ меняет IAM.
