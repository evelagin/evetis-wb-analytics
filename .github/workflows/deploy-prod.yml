name: deploy-prod
# Промоушен ПРОВЕРЕННОГО в shadow образа в prod. Образ НЕ пересобирается.
# GIT_SHA берём из source_git_sha сборки (а НЕ из commit запуска этого workflow).
on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Полный digest из shadow (…/wb-loader@sha256:…)"
        required: true
      source_git_sha:
        description: "SHA коммита, из которого собран этот образ (из summary deploy-shadow)"
        required: true
      only_job:
        description: "all — промоушен во все prod-Job'ы (нужна фраза в confirm_all); wb-stocks-prod — ТОЛЬКО остатки (Mig1b-0); wb-statistics / wb-ads / wb-finance / wb-supplies-ref — ТОЛЬКО Job'ы своего потока миграции. Состав режимов — tools/deploy_scope_check.py"
        type: choice
        options: ["all", "wb-stocks-prod", "wb-statistics", "wb-ads", "wb-finance", "wb-supplies-ref"]
        default: "all"
      confirm_all:
        description: "Только для only_job=all: впиши PROMOTE-ALL-PROD. Без фразы режим all ничего не обновляет (защита от выката во все prod-Job'ы значениями формы по умолчанию)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  promote-prod:
    runs-on: ubuntu-latest
    environment: production # ручной approval
    # Входы dispatch — только через env, не подстановкой ${{ }} в текст скрипта: свободный текст
    # из формы не должен становиться кодом shell в job'е с токеном sa-deployer.
    env:
      DIGEST: ${{ inputs.image_digest }}
      SOURCE_GIT_SHA: ${{ inputs.source_git_sha }}
      ONLY_JOB: ${{ inputs.only_job }}
      CONFIRM_ALL: ${{ inputs.confirm_all }}
    steps:
      # Первый шаг, ДО выдачи токена sa-deployer: режим all без фразы подтверждения не идёт дальше.
      - name: "Guard: режим all — только с фразой подтверждения"
        run: |
          if [ "$ONLY_JOB" = "all" ] && [ "$CONFIRM_ALL" != "PROMOTE-ALL-PROD" ]; then
            echo "::error title=deploy-prod::only_job=all обновляет ВСЕ prod-Job'ы. Впиши PROMOTE-ALL-PROD в confirm_all или выбери режим потока."
            exit 1
          fi
          echo "режим: $ONLY_JOB"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Validate digest
        run: |
          EXPECTED_PREFIX="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/wb-loader@sha256:"
          case "$DIGEST" in
            "${EXPECTED_PREFIX}"*) ;;
            *) echo "BAD digest: ожидался префикс ${EXPECTED_PREFIX}"; exit 1 ;;
          esac
          # После префикса — ровно 64 hex и ничего больше: запятая в digest стала бы лишними
          # переменными в --update-env-vars prod-Job'ов. SHA исходников — полный, 40 hex.
          [[ "${DIGEST#"$EXPECTED_PREFIX"}" =~ ^[0-9a-f]{64}$ ]] || { echo "BAD digest: после префикса нужен ровно sha256 из 64 hex"; exit 1; }
          [[ "$SOURCE_GIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "BAD source_git_sha: нужен полный SHA из 40 hex"; exit 1; }
          echo "digest ok: $DIGEST"
          # digest должен существовать в реестре
          gcloud artifacts docker images describe "$DIGEST" >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: "Охват выката: снимок всех Job'ов ДО (tools/deploy_scope_check.py)"
        id: scope_before
        run: |
          python3 tools/deploy_scope_check.py allowed "$ONLY_JOB" | sed 's/^/может обновить: /'
          gcloud run jobs list --region ${{ vars.GCP_REGION }} --format=json > scope_before.json
      - name: Deploy prod Jobs (промоушен того же digest, source sha)
        if: inputs.only_job == 'all'
        # PR-Mart3b-2 (аудит REV2, блокер #1): продвигаем ОДИН и тот же проверенный digest во ВСЕ
        # prod-Job'ы. Все используют один образ (dispatch по args[0] в cli.ts).
        # Без wb-mart-prod здесь Terraform-created Job остался бы на bootstrap hello-образе и
        # ручной/scheduler-запуск не вызвал бы `node dist/cli.js mart`.
        #
        # PR-1: добавлен wb-prices-prod — ровно по той же причине. Пропущенный в этом списке
        # Job молча остаётся на hello, который выходит с кодом 0 и ничего не наблюдает; при
        # следующих промоушенах он бы отставал по digest от остальных, и расхождение
        # не проявилось бы ни в одном «зелёном» прогоне.
        run: |
          for JOB in wb-stocks-prod wb-mart-prod wb-prices-prod wb-tariffs-prod; do
            echo "== promote ${JOB} =="
            gcloud run jobs update "${JOB}" \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          done
      - name: Deploy unitka-engine-prod (тот же digest)
        if: inputs.only_job == 'all'
        # UNITKA ENGINE v1 (Stage E1): тот же образ, dispatch args[0]=unitka. Пропуск оставил бы
        # Engine на bootstrap hello (урок PR-1). Шаг guarded: до infra apply Job'а нет, и это не
        # должно валить промоушен остальных prod-Job'ов.
        run: |
          if gcloud run jobs describe unitka-engine-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update unitka-engine-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=unitka-engine-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy ozon-unitka-prod (тот же digest)
        if: inputs.only_job == 'all'
        # Gate 9: суточный писатель Ozon-Юнитки. Тот же образ, dispatch args[0]=ozon-unitka.
        # Пропуск в этом списке оставил бы Job на bootstrap hello, который выходит с кодом 0
        # и молча ничего не пишет — расхождение не проявилось бы ни в одном «зелёном» прогоне
        # (урок PR-1). Guard сохраняет совместимость до первого infra apply.
        run: |
          if gcloud run jobs describe ozon-unitka-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update ozon-unitka-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=ozon-unitka-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy ozon-cpo-orders-prod (тот же digest)
        if: inputs.only_job == 'all'
        # Phase B (2026-10-08): «Оплата за заказ» Ozon, dispatch args[0]=ozon-cpo-orders, SA sa-ozon-cpo-loader.
        # Guard сохраняет совместимость до первого infra apply. Секреты — имена в Terraform env; workflow
        # их не читает и не меняет. Пропуск оставил бы Job на bootstrap-образе (урок PR-1).
        run: |
          if gcloud run jobs describe ozon-cpo-orders-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update ozon-cpo-orders-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=ozon-cpo-orders-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy unitka-store-pnl-prod (тот же digest)
        if: inputs.only_job == 'all'
        # Phase C (2026-10-09): P&L магазина WB, dispatch args[0]=unitka-store-pnl, SA sa-loaders-prod.
        # Лист — только чтение (scope readonly), пишет лишь снимок wb_ops. Guard — до первого infra apply.
        run: |
          if gcloud run jobs describe unitka-store-pnl-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update unitka-store-pnl-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=unitka-store-pnl-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy ozon-store-pnl-prod (тот же digest)
        if: inputs.only_job == 'all'
        # D4 (2026-10-15): P&L магазина Ozon, dispatch args[0]=ozon-store-pnl, SA sa-loaders-prod.
        # Читает только ozon_mart; без OZON_STORE_PNL_PUBLISH=1 Sheets readonly. Guard — до первого infra apply.
        run: |
          if gcloud run jobs describe ozon-store-pnl-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update ozon-store-pnl-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=ozon-store-pnl-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy wb-paid-storage-prod (тот же digest)
        if: inputs.only_job == 'all'
        # Stage E4: Job создаётся Terraform'ом. Guard сохраняет совместимость до первого infra apply.
        # Секрет остаётся WB_TOKEN_ANALYTICS из Terraform env; workflow его не читает и не меняет.
        run: |
          if gcloud run jobs describe wb-paid-storage-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update wb-paid-storage-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=wb-paid-storage-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      - name: Deploy wb-promo-prod (тот же digest)
        if: inputs.only_job == 'all'
        # PR-PROMO-1: наблюдатель акций WB. Тот же образ, dispatch args[0]=promo.
        # Guard сохраняет совместимость до первого infra apply: пока Terraform не
        # создал Job, шаг предупреждает и не валит промоушен остальных.
        #
        # Пропуск Job'а в этом списке — тот самый дефект, ради которого сюда
        # добавляли wb-prices-prod: Job молча остаётся на bootstrap hello, который
        # выходит с кодом 0 и НИЧЕГО не наблюдает, а история акций восстановлению
        # не подлежит — у Ozon исторической выгрузки акций нет вовсе.
        #
        # Секрет наблюдателя (WB_PRICES_READ_TOKEN) выставляется Terraform'ом
        # вместе с остальным env; workflow его не читает и не меняет.
        run: |
          if gcloud run jobs describe wb-promo-prod --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update wb-promo-prod \
              --region ${{ vars.GCP_REGION }} \
              --image "${DIGEST}" \
              --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
          else
            echo "::warning title=wb-promo-prod::Job ещё не создан Terraform'ом — шаг пропущен"
          fi
      # ── Потоки миграции Apps Script → Cloud Run (M2–M5): каждый — свой режим only_job ──────────────
      - name: "Deploy M2: wb-orders-prod + wb-sales-prod + wb-sales-reconcile-prod"
        if: inputs.only_job == 'all' || inputs.only_job == 'wb-statistics'
        # Job'ов нет, пока Terraform не применён с m2_prod_enabled=true (OWNER ACK cutover потока) — тогда шаг только
        # предупреждает. Боевые имена таблиц Terraform ставит на CREATE; загрузчик сам отказывает при чужом
        # контуре (targets.ts потока). Шаг НЕ включает Scheduler и НЕ запускает Job. Без шага Job остался бы
        # на bootstrap hello (урок PR-1).
        run: |
          for JOB in wb-orders-prod wb-sales-prod wb-sales-reconcile-prod; do
            if gcloud run jobs describe "$JOB" --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
              gcloud run jobs update "$JOB" \
                --region ${{ vars.GCP_REGION }} \
                --image "${DIGEST}" \
                --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
            else
              echo "::warning title=$JOB::Job ещё не создан Terraform'ом — шаг пропущен"
            fi
          done
      - name: "Deploy M3: wb-ads-prod + wb-ads-query-prod + wb-ads-costs-audit-prod"
        if: inputs.only_job == 'all' || inputs.only_job == 'wb-ads'
        # Job'ов нет, пока Terraform не применён с m3_prod_enabled=true (OWNER ACK cutover потока) — тогда шаг только
        # предупреждает. Боевые имена таблиц Terraform ставит на CREATE; загрузчик сам отказывает при чужом
        # контуре (targets.ts потока). Шаг НЕ включает Scheduler и НЕ запускает Job. Без шага Job остался бы
        # на bootstrap hello (урок PR-1).
        run: |
          for JOB in wb-ads-prod wb-ads-query-prod wb-ads-costs-audit-prod; do
            if gcloud run jobs describe "$JOB" --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
              gcloud run jobs update "$JOB" \
                --region ${{ vars.GCP_REGION }} \
                --image "${DIGEST}" \
                --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
            else
              echo "::warning title=$JOB::Job ещё не создан Terraform'ом — шаг пропущен"
            fi
          done
      - name: "Deploy M4: wb-finance-prod"
        if: inputs.only_job == 'all' || inputs.only_job == 'wb-finance'
        # Job'ов нет, пока Terraform не применён с m4_prod_enabled=true (OWNER ACK cutover потока) — тогда шаг только
        # предупреждает. Боевые имена таблиц Terraform ставит на CREATE; загрузчик сам отказывает при чужом
        # контуре (targets.ts потока). Шаг НЕ включает Scheduler и НЕ запускает Job. Без шага Job остался бы
        # на bootstrap hello (урок PR-1).
        run: |
          for JOB in wb-finance-prod; do
            if gcloud run jobs describe "$JOB" --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
              gcloud run jobs update "$JOB" \
                --region ${{ vars.GCP_REGION }} \
                --image "${DIGEST}" \
                --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
            else
              echo "::warning title=$JOB::Job ещё не создан Terraform'ом — шаг пропущен"
            fi
          done
      - name: "Deploy M5: wb-supplies-prod + ref-sync-prod"
        if: inputs.only_job == 'all' || inputs.only_job == 'wb-supplies-ref'
        # Job'ов нет, пока Terraform не применён с m5_prod_enabled=true (OWNER ACK cutover потока) — тогда шаг только
        # предупреждает. Боевые имена таблиц Terraform ставит на CREATE; загрузчик сам отказывает при чужом
        # контуре (targets.ts потока). Шаг НЕ включает Scheduler и НЕ запускает Job. Без шага Job остался бы
        # на bootstrap hello (урок PR-1).
        run: |
          for JOB in wb-supplies-prod ref-sync-prod; do
            if gcloud run jobs describe "$JOB" --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
              gcloud run jobs update "$JOB" \
                --region ${{ vars.GCP_REGION }} \
                --image "${DIGEST}" \
                --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}"
            else
              echo "::warning title=$JOB::Job ещё не создан Terraform'ом — шаг пропущен"
            fi
          done
      - name: Deploy wb-funnel-prod (отдельным шагом — у него свой секрет)
        if: inputs.only_job == 'all'
        # UNITKA 2.0 R6/R7. Воронка ходит в WB под ОТДЕЛЬНЫМ токеном WB_TOKEN_REPORTS
        # (решение владельца); WB_TOKEN_ANALYTICS не трогаем — на нём остатки и
        # платное хранение. Шаг отдельный, чтобы WB_ANALYTICS_SECRET не попал
        # на остальные Job'ы: у них секрет свой и менять его не требуется.
        #
        # env у Job стоит в ignore_changes Terraform'а на UPDATE, поэтому имя
        # секрета живому Job'у выставляет именно этот шаг, а не apply.
        # Предусловие: infra.yml apply уже выдал sa-loaders-prod
        # roles/secretmanager.secretAccessor на WB_TOKEN_REPORTS.
        run: |
          gcloud run jobs update wb-funnel-prod \
            --region ${{ vars.GCP_REGION }} \
            --image "${DIGEST}" \
            --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}",WB_ANALYTICS_SECRET=WB_TOKEN_REPORTS
      # НЕ включает Scheduler и НЕ меняет IAM.
      # ── Mig1b-0: целевой выкат ОДНОГО Job'а wb-stocks-prod ─────────────────────────────────────
      # Образ — только проверенный в shadow (digest = текущий образ wb-stocks-shadow), env — боевые
      # таблицы остатков. НЕ запускает Job, НЕ трогает Scheduler (у sa-deployer нет Scheduler Admin),
      # НЕ меняет args (их владелец — Terraform). Readback валит выкат, если изменился любой другой Job.
      # Порядок применения — docs/ops/MIG1B0_STOCKS_PROD_PREP.md, только по OWNER ACK MIG1B.
      - name: "wb-stocks-prod: pre-check — digest = образ wb-stocks-shadow, происхождение образа, контур prod; снимок всех Job'ов"
        if: inputs.only_job == 'wb-stocks-prod'
        run: |
          gcloud run jobs describe wb-stocks-shadow --region ${{ vars.GCP_REGION }} --format=json > shadow.json
          gcloud run jobs list --region ${{ vars.GCP_REGION }} --format=json > jobs_before.json
          # Происхождение: манифест и конфиг образа по digest (только GET в реестр). Проверка —
          # цепочка sha256 манифест → конфиг → метка git-sha, которую ставит deploy-shadow.
          REPO_PATH="${DIGEST%@*}"; REPO_PATH="${REPO_PATH#*/}"
          REG="https://${{ vars.GCP_REGION }}-docker.pkg.dev/v2/${REPO_PATH}"
          AUTH="Authorization: Bearer $(gcloud auth print-access-token)"
          curl -fsS -o manifest.json -H "$AUTH" \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' \
            "${REG}/manifests/${DIGEST#*@}"
          CONFIG_DIGEST=$(python3 tools/stocks_prod_deploy_check.py config-digest manifest.json)
          curl -fsSL -o image_config.json -H "$AUTH" "${REG}/blobs/${CONFIG_DIGEST}"
          python3 tools/stocks_prod_deploy_check.py pre shadow.json jobs_before.json manifest.json image_config.json "$DIGEST" "$SOURCE_GIT_SHA"
      - name: "wb-stocks-prod: образ + боевой env остатков"
        if: inputs.only_job == 'wb-stocks-prod'
        run: |
          gcloud run jobs update wb-stocks-prod \
            --region ${{ vars.GCP_REGION }} \
            --image "${DIGEST}" \
            --update-env-vars IMAGE_DIGEST="${DIGEST}",GIT_SHA="${SOURCE_GIT_SHA}",STOCKS_RAW_TABLE=RAW_WB_STOCKS,STOCKS_SNAPSHOT_TABLE=WB_STOCKS_SNAPSHOTS,STOCKS_T5_TABLE=RAW_WB_STOCKS_T5,STOCKS_T5_MODE=on,REF_SKU_TABLE=REF_SKU_MASTER,WB_ANALYTICS_SECRET=WB_TOKEN_ANALYTICS
      - name: "wb-stocks-prod: readback — образ, env, SA; остальные Job'ы не изменились"
        if: inputs.only_job == 'wb-stocks-prod'
        run: |
          gcloud run jobs describe wb-stocks-prod --region ${{ vars.GCP_REGION }} --format=json > stocks_prod.json
          gcloud run jobs list --region ${{ vars.GCP_REGION }} --format=json > jobs_after.json
          python3 tools/stocks_prod_deploy_check.py post stocks_prod.json jobs_before.json jobs_after.json "$DIGEST" "$SOURCE_GIT_SHA"
          {
            echo "### wb-stocks-prod promoted (only_job) — Scheduler НЕ тронут, Job НЕ запускался"
            echo "- image_digest: \`${DIGEST}\`"
            echo "- source_git_sha: \`${SOURCE_GIT_SHA}\`"
            echo "- Scheduler wb-stocks-prod проверить отдельно: PAUSED до OWNER ACK MIG1B"
          } >> "$GITHUB_STEP_SUMMARY"
      # Последний шаг, в ЛЮБОМ режиме и даже после сбоя шага выката: изменились только Job'ы режима,
      # каждый существующий Job режима — на digest, состав Job'ов прежний.
      - name: "Охват выката: снимок ПОСЛЕ — изменились только Job'ы режима"
        if: always() && steps.scope_before.outcome == 'success'
        run: |
          gcloud run jobs list --region ${{ vars.GCP_REGION }} --format=json > scope_after.json
          python3 tools/deploy_scope_check.py check "$ONLY_JOB" scope_before.json scope_after.json "$DIGEST"
          echo "- охват выката (${ONLY_JOB}): OK — tools/deploy_scope_check.py" >> "$GITHUB_STEP_SUMMARY"
