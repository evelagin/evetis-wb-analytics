name: autonomy-review
# AE v1 · Независимый ревьюер. НЕДОВЕРЕННЫЙ job, отдельная машина, чистый контекст.
# Видит цель, дифф, анализ влияния, доказательства ворот и ЗАЯВЛЕНИЕ автора — не его рассуждения.
# Инструменты: Read/Grep/Glob в режиме --restricted. Учётных данных GCP нет вовсе: шага auth
# нет, а привязка sa-ae-reader этот файл (job_workflow_ref) не пропускает — даже OIDC-токен,
# выпущенный отсюда, в GCP ничего не получает (tools/tests/test_autonomy_wif.py, C1).
# Идентичность Claude — СВОЯ: отдельный сервисный аккаунт и правило федерации ревьюера.
# Вердикт уходит артефактом с sha256 в outputs; переход делает доверенный job гейткипера.
on:
  workflow_call:
    inputs:
      # Не required: preflight их не передаёт; job прохода строго проверяет оба (пустое → отказ).
      run_id: {type: string, required: false, default: ""}
      state_sha: {type: string, required: false, default: ""}
      mode:
        description: "run — проход AE; preflight — только аутентификация Claude API (Фаза 0)"
        type: string
        required: false
        default: run
    outputs:
      hashes:
        description: "NAME=SHA256 через пробел (reviewer.json, reviewer_diagnostics.json) — для --expect гейткипера"
        value: ${{ jobs.review.outputs.hashes }}

permissions: {}

jobs:
  review:
    if: inputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write    # только федерация Claude API
    outputs:
      hashes: ${{ steps.review.outputs.hashes }}
    env:
      STATE_DIR: ${{ github.workspace }}/.ae-state
      RUN_ID: ${{ inputs.run_id }}
      STATE_SHA: ${{ inputs.state_sha }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.AE_ANTHROPIC_REVIEWER_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.AE_ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.AE_ANTHROPIC_REVIEWER_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.AE_ANTHROPIC_WORKSPACE_ID }}
      ENGINEER_RULE_ID: ${{ vars.AE_ANTHROPIC_FEDERATION_RULE_ID }}
    steps:
      - name: guard — только main, строгие входы
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::только из main"; exit 1; }
          [[ "$RUN_ID" =~ ^run-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$ ]] || { echo "::error::неверный run_id"; exit 1; }
          [[ "$STATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::неверный state_sha"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install pinned dependencies (hash-checked)
        run: "pip install --only-binary=:all: --require-hashes -r tools/requirements-sql-ci.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"   # @anthropic-ai/claude-code@2.1.251: engines node >=22
      - name: install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.251
      - name: clone state at pinned sha (read)
        env:
          GH_TOKEN: ${{ github.token }}   # contents: read — только на этот шаг
        run: bash tools/autonomy/ci/state_clone.sh "$STATE_SHA"
      - name: independent review
        id: review
        run: |
          state=$(python -m tools.autonomy.cli status --state-dir "$STATE_DIR" --run-id "$RUN_ID" | awk '{print $2}')
          [ "$state" = "REVIEWING" ] || { echo "состояние $state — ревью не нужно"; echo "hashes=" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -n "${ANTHROPIC_API_KEY:-}${ANTHROPIC_AUTH_TOKEN:-}${ANTHROPIC_PROFILE:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::статический ключ/токен/профиль Anthropic перекрыл бы федерацию"; exit 1; fi
          [ -n "$ANTHROPIC_FEDERATION_RULE_ID" ] && [ "$ANTHROPIC_FEDERATION_RULE_ID" != "$ENGINEER_RULE_ID" ] \
            || { echo "::error::у ревьюера должно быть СВОЁ правило федерации"; exit 1; }
          # Фактический scope и срок токена Claude — ДО агента (policy.json → anthropic_runtime).
          python -m tools.autonomy.anthropic_scope check --role reviewer > "$RUNNER_TEMP/scope_guard.json" \
            || { cat "$RUNNER_TEMP/scope_guard.json"; exit 1; }
          cat "$RUNNER_TEMP/scope_guard.json"
          export ANTHROPIC_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/anthropic-oidc.jwt"
          bash tools/autonomy/ci/refresh_anthropic_oidc.sh
          ( while sleep 240; do bash tools/autonomy/ci/refresh_anthropic_oidc.sh || true; done ) &
          rc=0
          python -m tools.autonomy.cli review --ci --engineer none --reviewer claude \
            --state-dir "$STATE_DIR" --run-id "$RUN_ID" --out "$RUNNER_TEMP/pending" \
            --sandbox-root "$RUNNER_TEMP/sandboxes" --scope-guard-file "$RUNNER_TEMP/scope_guard.json" \
            > "$RUNNER_TEMP/review.json" || rc=$?
          # 0 — вердикт есть; 3 — ревьюер отказал, диагностика записана (документированная передача
          # гейткиперу, который запаркует прогон в BLOCKED с классом отказа в причине); исключения внутри агента/оркестратора тоже здесь (стадия WRAPPER_EXCEPTION в диагностике);
          # иной код — сбой ДО записи диагностики (импорт, окружение): job падает.
          case "$rc" in 0|3) ;; *) echo "::error::сбой обёртки ревьюера (код $rc)"; exit "$rc" ;; esac
          python -c 'import json,sys; o=json.load(open(sys.argv[1]))["outputs"]; print("hashes=" + " ".join(f"{k}={v}" for k,v in o.items()))' \
            "$RUNNER_TEMP/review.json" >> "$GITHUB_OUTPUT"
          python -m tools.autonomy.cli diag-summary --file "$RUNNER_TEMP/pending/reviewer_diagnostics.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 3 ]; then
            echo "::error::ревьюер отказал — диагностика передана доверенному гейткиперу (см. итог job'а)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ae-${{ inputs.run_id }}-review-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pending
          retention-days: 30
          if-no-files-found: ignore

  # Фаза 0: только аутентификация Claude API ревьюера. Тот же файл → тот же job_workflow_ref, что у
  # прохода, поэтому совпадает правило федерации. Нет: Claude Code, модели, GCP (sa-ae-reader),
  # autonomy-state, артефактов. Двойной выключатель: вход mode и AE_PREFLIGHT_ENABLED.
  preflight:
    if: inputs.mode == 'preflight' && vars.AE_PREFLIGHT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write    # только OIDC → обмен на токен Claude API
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.AE_ANTHROPIC_REVIEWER_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.AE_ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.AE_ANTHROPIC_REVIEWER_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.AE_ANTHROPIC_WORKSPACE_ID }}
      ENGINEER_RULE_ID: ${{ vars.AE_ANTHROPIC_FEDERATION_RULE_ID }}
      ENGINEER_SERVICE_ACCOUNT_ID: ${{ vars.AE_ANTHROPIC_SERVICE_ACCOUNT_ID }}
    steps:
      - name: guard — только main, только autonomy-run.yml@main, только workflow_dispatch
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::только из main"; exit 1; }
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { echo "::error::только workflow_dispatch"; exit 1; }
          [ "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/autonomy-run.yml@refs/heads/main" ] \
            || { echo "::error::только из autonomy-run.yml@main"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Claude API WIF preflight — только обмен токена (stdlib, без модели)
        run: python3 -m tools.autonomy.anthropic_scope preflight --role reviewer
