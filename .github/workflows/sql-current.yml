name: sql-current
# R2B: офлайн-проверка канонического слоя sql/current/** (манифест v2, canonical_hash_v1,
# безопасность SQL по AST, граф зависимостей, изоляция маркетплейсов, C17).
# Без облачных креденшелов, без секретов, без BigQuery. Паритет с production НЕ доказывает (R2C).
# На каждый PR без фильтра путей и после слияния в main (защита ветки на текущем тарифе недоступна).
on:
  pull_request:
  push:
    branches: ["main"]
  # AE v1 (S8): PR от GITHUB_TOKEN не запускает pull_request. Публикатор AE диспатчит этот
  # workflow на ветке кандидата ae/*; READY_FOR_HUMAN_REVIEW — только по его success.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-current:
    name: sql-current
    runs-on: ubuntu-latest
    # Full tools suite now approaches ten minutes before final SQL validation.
    # Keep every gate; allow measured execution time plus setup/validation.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install pinned dependencies (hash-checked)
        run: "pip install --only-binary=:all: --require-hashes -r tools/requirements-sql-ci.txt"
      - name: validator tests
        run: python -m pytest -q tools/tests
      - name: validate sql/current
        run: python tools/validate_current_sql.py
