name: autonomy-gate
# AE v1 · ДОВЕРЕННЫЙ детерминированный шаг. Единственный, кто меняет авторитетное состояние
# (ветка autonomy-state). Код агента и кода кандидата здесь НЕ исполняется: недоверенный
# вывод только проверяется по sha256 из outputs job'а-производителя и воспроизводится,
# а анализ влияния считается инструментом ДОВЕРЕННОГО checkout (main), не песочницы кандидата.
#   prepare — открыть/продолжить прогон, собрать доказательства БАЗОВОГО коммита (он обязан
#             лежать в истории origin/main — --trusted-base-ref)
#   ingest  — воспроизвести план и реализацию инженера → TESTING / WAITING_FOR_HUMAN / BLOCKED
#   verify  — воспроизвести доказательства кандидата → REVIEWING / FIXING / BLOCKED
#   gate    — воспроизвести вердикт ревьюера, решить гейткипером → READY_FOR_PR / FIXING / …
#   audit   — доверенный аудит production-мутаций всего окна прогона (только в READY_FOR_PR): без
#             его PASS, покрывающего все вызовы агента, публикатор не публикует
# Действия закреплены по SHA коммита: этот job держит токен записи.
on:
  workflow_call:
    inputs:
      step: {type: string, required: true}
      run_id: {type: string, required: false, default: ""}
      objective_path: {type: string, required: false, default: ""}
      pending_artifact: {type: string, required: false, default: ""}
      retest_artifact: {type: string, required: false, default: ""}
      expect: {type: string, required: false, default: ""}
    outputs:
      run_id:
        value: ${{ jobs.step.outputs.run_id }}
      state_sha:
        value: ${{ jobs.step.outputs.state_sha }}
      state:
        value: ${{ jobs.step.outputs.state }}

permissions: {}

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write    # ТОЛЬКО refs/heads/autonomy-state (tools/autonomy/ci/state_push.sh)
      id-token: write    # sa-ae-reader (job_workflow_ref autonomy-gate.yml): доказательства базы и аудит
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      state_sha: ${{ steps.push.outputs.state_sha }}
      state: ${{ steps.run.outputs.state }}
    env:
      STATE_DIR: ${{ github.workspace }}/.ae-state
      STEP: ${{ inputs.step }}
      OBJECTIVE_PATH: ${{ inputs.objective_path }}
      RUN_ID_IN: ${{ inputs.run_id }}
      EXPECT: ${{ inputs.expect }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      AE_READER_SA: ${{ vars.AE_READER_SA }}
    steps:
      - name: guard — только main, известный шаг, строгие входы
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::только из main"; exit 1; }
          case "$STEP" in prepare|ingest|verify|gate|audit) ;; *) echo "::error::неизвестный шаг"; exit 1 ;; esac
          [[ -z "$OBJECTIVE_PATH" || "$OBJECTIVE_PATH" =~ ^objectives/[A-Za-z0-9._-]+\.json$ ]] \
            || { echo "::error::цель только objectives/<имя>.json"; exit 1; }
          [[ -z "$RUN_ID_IN" || "$RUN_ID_IN" =~ ^run-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$ ]] \
            || { echo "::error::неверный run_id"; exit 1; }
          [[ -z "$EXPECT" || "$EXPECT" =~ ^([a-z_]+\.(json|patch)=[0-9a-f]{64}( |$))+$ ]] \
            || { echo "::error::неверный expect"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install pinned dependencies (hash-checked)
        run: "pip install --only-binary=:all: --require-hashes -r tools/requirements-sql-ci.txt"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: inputs.step == 'prepare' || inputs.step == 'audit'
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.AE_READER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        if: inputs.step == 'prepare' || inputs.step == 'audit'
      - name: clone state (tip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/autonomy/ci/state_clone.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.pending_artifact != '' && inputs.expect != ''
        with:
          name: ${{ inputs.pending_artifact }}
          # Вне рабочего каталога: недоверенный архив не ложится рядом с исполняемым кодом.
          path: ${{ runner.temp }}/ae-pending
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.retest_artifact != '' && inputs.expect != ''
        with:
          name: ${{ inputs.retest_artifact }}
          path: ${{ runner.temp }}/ae-pending
      - name: deterministic transition
        id: run
        env:
          PENDING: ${{ runner.temp }}/ae-pending
        run: |
          common=(--state-dir "$STATE_DIR" --sandbox-root "$RUNNER_TEMP/sandboxes" --trusted-base-ref origin/main)
          RUN_ID="$RUN_ID_IN"
          if [ "$STEP" = "prepare" ] && [ -n "$OBJECTIVE_PATH" ]; then
            python -m tools.autonomy.cli validate --kind objective "$STATE_DIR/$OBJECTIVE_PATH"
            RUN_ID=$(python -m tools.autonomy.cli submit --state-dir "$STATE_DIR" --objective "$STATE_DIR/$OBJECTIVE_PATH" \
              --trusted-base-ref origin/main | python -c 'import json,sys; print(json.load(sys.stdin)["run_id"])')
          fi
          [[ "$RUN_ID" =~ ^run-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$ ]] || { echo "::error::нет run_id"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          state=$(python -m tools.autonomy.cli status --state-dir "$STATE_DIR" --run-id "$RUN_ID" | awk '{print $2}')
          read -r -a expect <<< "$EXPECT"
          case "$STEP" in
            prepare)
              python -m tools.autonomy.cli advance --engineer none --reviewer none "${common[@]}" --run-id "$RUN_ID" \
                --project "$GCP_PROJECT_ID" --token-command "gcloud auth print-access-token" \
                --audit-identity "$AE_READER_SA" \
                --stop-before PLANNING IMPLEMENTING FIXING TESTING REVIEWING ;;
            ingest)
              if [[ "$state" =~ ^(PLANNING|IMPLEMENTING|FIXING)$ ]] && [ ${#expect[@]} -gt 0 ]; then
                python -m tools.autonomy.cli advance --engineer replay --reviewer none "${common[@]}" --run-id "$RUN_ID" \
                  --pending-dir "$PENDING" --expect "${expect[@]}" --stop-before TESTING REVIEWING
              else echo "ingest: состояние $state — нечего воспроизводить"; fi ;;
            verify)
              if [ "$state" = "TESTING" ] && [ ${#expect[@]} -gt 0 ]; then
                python -m tools.autonomy.cli advance --engineer none --reviewer none --evidence replay "${common[@]}" \
                  --run-id "$RUN_ID" --pending-dir "$PENDING" --expect "${expect[@]}" \
                  --stop-before REVIEWING FIXING PLANNING IMPLEMENTING
              fi ;;
            gate)
              if [ "$state" = "REVIEWING" ] && [ ${#expect[@]} -gt 0 ]; then
                python -m tools.autonomy.cli advance --engineer none --reviewer replay "${common[@]}" --run-id "$RUN_ID" \
                  --pending-dir "$PENDING" --expect "${expect[@]}" --stop-before FIXING PLANNING IMPLEMENTING TESTING
              fi ;;
            audit)
              # Сохранённый результат не PASS (код 3: FAIL с найденными мутациями или BLOCKED) ОБЯЗАН попасть
              # в autonomy-state: шаг не падает до persist, публикатор отвергнет публикацию по доказательству.
              # Любой другой код — аудит упал ДО сохранения: шаг падает, publish (needs: audit) не запускается,
              # и прежний PASS не может быть переиспользован.
              if [ "$state" = "READY_FOR_PR" ]; then
                audit_rc=0
                python -m tools.autonomy.cli audit "${common[@]}" --run-id "$RUN_ID" \
                  --project "$GCP_PROJECT_ID" --token-command "gcloud auth print-access-token" \
                  --audit-identity "$AE_READER_SA" || audit_rc=$?
                if [ "$audit_rc" = 3 ]; then
                  echo "::error::доверенный аудит не PASS — результат сохранён, публикация будет отвергнута"
                elif [ "$audit_rc" != 0 ]; then
                  echo "::error::доверенный аудит упал до сохранения результата (код $audit_rc)"; exit "$audit_rc"
                fi
              else echo "audit: состояние $state — аудит перед публикацией не нужен"; fi ;;
          esac
          echo "state=$(python -m tools.autonomy.cli status --state-dir "$STATE_DIR" --run-id "$RUN_ID" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: persist authoritative state
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          NEW_STATE: ${{ steps.run.outputs.state }}
        run: |
          sha=$(bash tools/autonomy/ci/state_push.sh "autonomy-gate ${STEP}: ${RUN_ID} → ${NEW_STATE}" | tail -1)
          echo "state_sha=$sha" >> "$GITHUB_OUTPUT"
