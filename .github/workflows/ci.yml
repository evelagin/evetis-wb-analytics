name: ci
# PR-проверки. БЕЗ деплоя, без облачных креденшелов, без backend.
on:
  # Tenancy T1: реестр арендаторов и его валидатор — входы ворот tenancy и тестов Ozon
  # (test_tenant_portability читает tenants/**), поэтому они в фильтре путей.
  pull_request:
    paths: ["cloud/**", "services/**", "pipelines/**", "infra/**", ".github/workflows/**",
            "tenants/**", "tools/tenancy/**", "tools/autonomy/schema.py",
            "tools/tests/test_tenancy*.py"]
  push:
    branches-ignore: ["main"]
    paths: ["cloud/**", "services/**", "pipelines/**", "infra/**",
            "tenants/**", "tools/tenancy/**", "tools/autonomy/schema.py",
            "tools/tests/test_tenancy*.py"]
  # AE v1 (S8): обязательная проверка ветки кандидата ae/* (диспатч публикатора, без фильтра путей).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Docker build (no push)
        run: docker build -t wb-loader:ci .

  wb-communications:
    # Stage A / A2. Сервис публикует ответы в Wildberries; до Stage A он
    # доставлялся мимо CI и без исходников в Git. Здесь только проверки:
    # ни деплоя, ни push образа, ни облачных креденшелов.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wb-communications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Совпадает с базовым образом Dockerfile (python:3.12-slim).
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Compile all sources
        run: python -m compileall -q app scripts
      - run: python -m pytest -q
      - name: Docker build (no push)
        run: docker build -t evetis-wb-communications:ci .

  ozon:
    # Stage A / A3. До этого pipelines/ozon/** не входил ни в один workflow:
    # соответствие развёрнутого образа репозиторию было недоказуемо.
    # Проверки офлайновые — Ozon API и BigQuery не вызываются.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Совпадает с базовым образом обоих Dockerfile (python:3.12-slim).
          python-version: "3.12"
      - run: pip install -r pipelines/ozon/requirements-dev.txt
      - name: Compile all sources
        run: python -m compileall -q pipelines/ozon/runtime pipelines/ozon/bootstrap pipelines/ozon/tests
      - name: Deployment contract tests
        run: python -m pytest -q pipelines/ozon/tests
      - name: Docker build runtime (no push)
        run: docker build -t ozon-runtime-ingest:ci pipelines/ozon/runtime
      - name: Docker build bootstrap (no push)
        run: docker build -t ozon-bootstrap-load:ci pipelines/ozon/bootstrap

  tenancy:
    # Tenancy T1 (ADR-08). Реестр tenants/*/tenant.json: схема tenant.v1, канонические
    # имена, защита EVETIS, коллизии, поиск учётных данных. Офлайн: ни облака, ни сети.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pinned dependencies (hash-checked)
        run: "pip install --only-binary=:all: --require-hashes -r tools/requirements-sql-ci.txt"
      - name: validate tenant registry
        run: python tools/tenancy/registry.py validate
      - name: tenancy tests
        run: python -m pytest -q tools/tests/test_tenancy.py tools/tests/test_tenancy_hardening.py tools/tests/test_tenancy_t32.py tools/tests/test_tenancy_t32_remediation.py
      - name: ozon schema parity (offline)
        run: python tools/tenancy/ozon_schema_parity.py

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt (all)
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: validate terraform (offline)
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: validate bootstrap (offline)
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: validate tenant root (offline)
        working-directory: infra/tenant
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: tenant root tests (mock provider, no cloud)
        working-directory: infra/tenant
        run: terraform test
      - name: tenant root mutation check (weakened rules must fail the tests)
        run: python3 tools/tenancy/tf_mutation_check.py
