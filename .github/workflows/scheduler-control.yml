name: scheduler-control
# Управление расписанием отдельно от деплоя (аудит-френдли, без Console).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "окружение (wb-mart существует ТОЛЬКО в prod — он prodOnly)"
        required: true
        type: choice
        options: [shadow, prod]
      loader:
        description: "имя loader; итоговый job = <loader>-<environment>"
        required: true
        default: "wb-stocks"
        type: choice
        options: [wb-stocks, wb-mart, wb-prices, wb-tariffs, wb-funnel, wb-paid-storage, unitka-engine, ozon-unitka]
      action:
        description: "pause | resume | run-now"
        required: true
        type: choice
        options: [pause, resume, run-now]

permissions:
  contents: read
  id-token: write

jobs:
  control:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'infra' }}
    steps:
      # Fail-fast ПЕРВЫМ шагом (аудит PR-Mart3b-3, блокер #1): `mart` помечен prodOnly в реестре
      # загрузчиков (cloud/src/loaders/registry.ts), Terraform создаёт только wb-mart-prod →
      # job `wb-mart-shadow` не существует НИКОГДА. Без этой проверки UI предлагает заведомо
      # недопустимую комбинацию, а оператор узнаёт об ошибке из невнятного NOT_FOUND от gcloud —
      # уже после WIF-аутентификации привилегированным SA. Проверка идёт ДО auth осознанно.
      - name: Reject impossible loader/environment combination
        run: |
          # PR-1: wb-prices существует только в prod по той же причине, что и wb-mart —
          # Terraform создаёт единственный Job wb-prices-prod, теневого контура у наблюдателя
          # цен нет (лишний носитель доступа к ценовому секрету не нужен).
          case "${{ inputs.loader }}" in
            wb-mart|wb-prices|wb-tariffs|wb-funnel|wb-paid-storage|ozon-unitka)
              # UNITKA 2.0 R3: воронка тоже существует только в prod (wb-funnel-prod).
              # Stage E4: платное хранение помечено prodOnly в реестре загрузчиков и пишет
              # production RAW; Terraform создаёт единственный Job wb-paid-storage-prod,
              # теневого контура у него нет. Маппинг: wb-paid-storage → wb-paid-storage-prod,
              # имя Cloud Scheduler совпадает с именем Job (infra/terraform/wb_paid_storage_loader.tf).
              #
              # Gate 9B: ozon-unitka тоже существует ТОЛЬКО в prod. Теневого контура у писателя
              # Юнитки нет и быть не должно: лист у книги один, а два писателя в один лист —
              # это ровно тот случай, который запрещён (infra/terraform/ozon_unitka.tf).
              # Расписание ozon-unitka-prod создаётся НА ПАУЗЕ; resume — отсюда, после первого
              # удачного run-now. Порядок эксплуатации: docs/ops/OZON_UNITKA_OPERATIONS.md.
              if [ "${{ inputs.environment }}" != "prod" ]; then
                echo "::error title=Invalid combination::${{ inputs.loader }} is prod-only; job ${{ inputs.loader }}-${{ inputs.environment }} does not exist. Use environment=prod."
                exit 1
              fi
              ;;
          esac
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_APPLY_SA }} # scheduler admin + run execute
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply action
        run: |
          JOB="${{ inputs.loader }}-${{ inputs.environment }}"
          # UNITKA ENGINE v1: у Job'а unitka-engine-<env> ДВА Scheduler'а (-morning, -reserve);
          # pause/resume действуют на оба, run-now запускает сам Job (infra/terraform/unitka_engine.tf).
          SCHEDULERS="$JOB"
          if [ "${{ inputs.loader }}" = "unitka-engine" ]; then
            SCHEDULERS="${JOB}-morning ${JOB}-reserve"
          fi
          case "${{ inputs.action }}" in
            pause)   for S in $SCHEDULERS; do gcloud scheduler jobs pause  "$S" --location ${{ vars.GCP_REGION }}; done ;;
            resume)  for S in $SCHEDULERS; do gcloud scheduler jobs resume "$S" --location ${{ vars.GCP_REGION }}; done ;;
            run-now) gcloud run jobs execute "$JOB" --region ${{ vars.GCP_REGION }} --wait ;;
            *) echo "unknown action"; exit 1 ;;
          esac
