name: scheduler-control
# Управление расписанием отдельно от деплоя (аудит-френдли, без Console).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "окружение (wb-mart существует ТОЛЬКО в prod — он prodOnly)"
        required: true
        type: choice
        options: [shadow, prod]
      loader:
        description: "имя loader; итоговый job = <loader>-<environment>"
        required: true
        default: "wb-stocks"
        type: choice
        options: [wb-stocks, wb-mart, wb-mart-finance-catchup, wb-prices, wb-tariffs, wb-funnel, wb-paid-storage, unitka-engine, ozon-unitka, ozon-cpo-orders, unitka-store-pnl]
      action:
        description: "pause | resume | run-now"
        required: true
        type: choice
        options: [pause, resume, run-now]

permissions:
  contents: read
  id-token: write

jobs:
  control:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'infra' }}
    # Входы — через env, не подстановкой ${{ }} в текст скрипта (job держит токен sa-terraform-apply).
    env:
      LOADER: ${{ inputs.loader }}
      TARGET_ENV: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
    steps:
      # Fail-fast ПЕРВЫМ шагом (аудит PR-Mart3b-3, блокер #1): `mart` помечен prodOnly в реестре
      # загрузчиков (cloud/src/loaders/registry.ts), Terraform создаёт только wb-mart-prod →
      # job `wb-mart-shadow` не существует НИКОГДА. Без этой проверки UI предлагает заведомо
      # недопустимую комбинацию, а оператор узнаёт об ошибке из невнятного NOT_FOUND от gcloud —
      # уже после WIF-аутентификации привилегированным SA. Проверка идёт ДО auth осознанно.
      - name: Reject impossible loader/environment combination
        run: |
          # PR-1: wb-prices существует только в prod по той же причине, что и wb-mart —
          # Terraform создаёт единственный Job wb-prices-prod, теневого контура у наблюдателя
          # цен нет (лишний носитель доступа к ценовому секрету не нужен).
          case "${LOADER}" in
            wb-mart|wb-mart-finance-catchup|wb-prices|wb-tariffs|wb-funnel|wb-paid-storage|ozon-unitka|ozon-cpo-orders|unitka-store-pnl)
              # UNITKA 2.0 R3: воронка тоже существует только в prod (wb-funnel-prod).
              # Stage E4: платное хранение помечено prodOnly в реестре загрузчиков и пишет
              # production RAW; Terraform создаёт единственный Job wb-paid-storage-prod,
              # теневого контура у него нет. Маппинг: wb-paid-storage → wb-paid-storage-prod,
              # имя Cloud Scheduler совпадает с именем Job (infra/terraform/wb_paid_storage_loader.tf).
              #
              # Gate 9B: ozon-unitka тоже существует ТОЛЬКО в prod. Теневого контура у писателя
              # Юнитки нет и быть не должно: лист у книги один, а два писателя в один лист —
              # это ровно тот случай, который запрещён (infra/terraform/ozon_unitka.tf).
              # Расписание ozon-unitka-prod создаётся НА ПАУЗЕ; resume — отсюда, после первого
              # удачного run-now. Порядок эксплуатации: docs/ops/OZON_UNITKA_OPERATIONS.md.
              #
              # Phase B: ozon-cpo-orders — только prod (Job и Scheduler ozon-cpo-orders-prod,
              # infra/terraform/ozon_cpo_orders.tf); теневого контура у загрузчика CPO нет.
              #
              # Phase C: unitka-store-pnl — только prod (Job и Scheduler unitka-store-pnl-prod,
              # infra/terraform/unitka_store_pnl.tf).
              if [ "${TARGET_ENV}" != "prod" ]; then
                echo "::error title=Invalid combination::${LOADER} is prod-only; job ${LOADER}-${TARGET_ENV} does not exist. Use environment=prod."
                exit 1
              fi
              ;;
          esac
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_APPLY_SA }} # scheduler admin + run execute
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Apply action
        run: |
          JOB="${LOADER}-${TARGET_ENV}"
          # UNITKA ENGINE v1: у Job'а unitka-engine-<env> ДВА Scheduler'а (-morning, -reserve);
          # pause/resume действуют на оба, run-now запускает сам Job (infra/terraform/unitka_engine.tf).
          SCHEDULERS="$JOB"
          if [ "${LOADER}" = "unitka-engine" ]; then
            SCHEDULERS="${JOB}-morning ${JOB}-reserve"
          fi
          # Догоняющий слот витрины под WEEKLY-финансы: своё расписание у ТОГО ЖЕ Job'а wb-mart-prod
          # (infra/terraform/scheduler.tf). pause/resume — только этот слот; run-now — сам Job.
          if [ "${LOADER}" = "wb-mart-finance-catchup" ]; then
            JOB="wb-mart-${TARGET_ENV}"
            SCHEDULERS="${JOB}-finance-catchup"
          fi
          # Стоп-кран витрины: pause wb-mart ставит на паузу ОБА её расписания (основное и догоняющий
          # слот), иначе слот 12:45 МСК продолжил бы запускать Job. resume wb-mart — ТОЛЬКО основное:
          # догоняющий слот включается отдельно (loader=wb-mart-finance-catchup).
          # Pause идемпотентен (Cloud Scheduler PauseJob: «A job must be in ENABLED to be paused» —
          # повторная пауза дала бы FAILED_PRECONDITION и ложный «стоп» в рунбуке B1). По каждому
          # расписанию, основное ПЕРВЫМ: state из describe → PAUSED: пропуск с notice; иное: pause.
          # NOT_FOUND допустим только для слота (до terraform apply); любая иная ошибка describe/pause —
          # громкий отказ шага, но ПОСЛЕ попытки по второму расписанию: стоп-кран останавливает всё, что
          # может, и не может «тихо» не сработать.
          if [ "${LOADER}" = "wb-mart" ] && [ "${ACTION}" = "pause" ]; then
            FAILED=0
            for S in "${JOB}" "${JOB}-finance-catchup"; do
              if ! STATE=$(gcloud scheduler jobs describe "$S" --location ${{ vars.GCP_REGION }} --format='value(state)' 2>&1); then
                if [ "$S" != "${JOB}" ] && echo "${STATE}" | grep -q "NOT_FOUND"; then
                  echo "::notice title=catch-up slot absent::$S не существует — пропуск"
                  continue
                fi
                echo "::error title=describe failed::$S: ${STATE}"
                FAILED=1
                continue
              fi
              if [ "${STATE}" = "PAUSED" ]; then
                echo "::notice title=already paused::$S уже PAUSED — пропуск"
                continue
              fi
              if ! gcloud scheduler jobs pause "$S" --location ${{ vars.GCP_REGION }}; then
                echo "::error title=pause failed::$S"
                FAILED=1
              fi
            done
            exit "${FAILED}"
          fi
          case "${ACTION}" in
            pause)   for S in $SCHEDULERS; do gcloud scheduler jobs pause  "$S" --location ${{ vars.GCP_REGION }}; done ;;
            resume)  for S in $SCHEDULERS; do gcloud scheduler jobs resume "$S" --location ${{ vars.GCP_REGION }}; done ;;
            run-now) gcloud run jobs execute "$JOB" --region ${{ vars.GCP_REGION }} --wait ;;
            *) echo "unknown action"; exit 1 ;;
          esac
